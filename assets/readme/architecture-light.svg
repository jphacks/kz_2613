<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 294" width="838" height="294" role="img"><title>システム構成。スマホ（ブラウザ）2〜4台のP1移動・P2視点・P3アクションの操作を、WebSocketとWebRTCでWindows PCのRustホストへ送り、Rustホストは役割と準備状況をスマホへ返す。Rustホストは入力を統合し、Windows APIのSendInputでキーボード・マウス操作として既存のPCゲーム（Minecraftなど）へ送る。PCアプリ（Tauri）はRustホストから参加・準備状況を受け取り、ゲーム選択・開始・停止を伝える。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#FFF5DC"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 10)"><rect x="1" y="15" width="220" height="238" rx="18" fill="none" stroke="url(#brand)" stroke-width="2" stroke-dasharray="6 5"/><rect x="20" y="2" width="198.2" height="24" rx="12" fill="url(#brand)"/><text x="119.10000000000001" y="18.5" class="gh" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">スマホ（ブラウザ）× 2〜4台</text><g transform="translate(18.0 74.0) scale(0.4133)"><g><path d="M12 4C38 12 62 12 88 4C97 1 103 8 101 18C95 55 95 95 101 132C103 142 97 149 88 146C62 138 38 138 12 146C3 149-3 142-1 132C5 95 5 55-1 18C-3 8 3 1 12 4Z" fill="#24C2FA" stroke="#3A3A3A" stroke-width="1.4"/><rect x="14" y="16" width="72" height="117" rx="11" fill="#0B0C10"/><g filter="url(#glow)" transform="translate(0 6)"><g><circle cx="37" cy="46" r="8.5" fill="#19F6FF"/><circle cx="63" cy="46" r="8.5" fill="#19F6FF"/></g><path d="M45 56l5 5 5-5" fill="none" stroke="#19F6FF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><rect x="22.666666666666664" y="144" width="34" height="22" rx="11" fill="#24C2FA"/><text x="39.666666666666664" y="159.5" class="gh" font-size="13" font-weight="700" fill="#06243A" text-anchor="middle">P1</text><text x="39.666666666666664" y="186" class="gh" font-size="13" font-weight="700" fill="#2E2B48" text-anchor="middle">移動</text><g transform="translate(89.3 74.0) scale(0.4133)"><g><path d="M12 4C38 12 62 12 88 4C97 1 103 8 101 18C95 55 95 95 101 132C103 142 97 149 88 146C62 138 38 138 12 146C3 149-3 142-1 132C5 95 5 55-1 18C-3 8 3 1 12 4Z" fill="#5EFF5D" stroke="#3A3A3A" stroke-width="1.4"/><rect x="14" y="16" width="72" height="117" rx="11" fill="#0B0C10"/><g filter="url(#glow)" transform="translate(0 6)"><g><rect x="29" y="37" width="15" height="14" rx="2.5" fill="#86FF55"/><rect x="56" y="37" width="15" height="14" rx="2.5" fill="#86FF55"/></g><rect x="44" y="56" width="12" height="5" rx="2.5" fill="#86FF55"/></g></g></g><rect x="94.0" y="144" width="34" height="22" rx=