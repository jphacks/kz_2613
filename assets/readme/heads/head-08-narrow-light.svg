<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 112" width="480" height="112" role="img"><title>技術仕様書</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#FFF5DC"/></linearGradient><style>@font-face{font-family:RcRounded;font-weight:800;src:url(data:font/woff;base64,) format('woff')}
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><rect x="1" y="6" width="478" height="100" rx="16" fill="#F6F9FC" stroke="#D8DEE8"/><rect x="1" y="6" width="8" height="100" rx="4" fill="url(#brand)"/><g transform="translate(17.6 30.0) scale(0.3472)"><g class="bob" style="animation-delay:0.00s"><path d="M12 4C38 12 62 12 88 4C97 1 103 8 101 18C95 55 95 95 101 132C103 142 97 149 88 146C62 138 38 138 12 146C3 149-3 142-1 132C5 95 5 55-1 18C-3 8 3 1 12 4Z" fill="#FF1D00" stroke="#3A3A3A" stroke-width="1.4"/><rect x="14" y="16" width="72" height="117" rx="11" fill="#0B0C10"/><g filter="url(#glow)" transform="translate(0 6)"><g class="eyes" style="animation-delay:0.00s"><rect x="25" y="43" width="20" height="7" rx="3.5" fill="#FF4A3D" transform="rotate(28 35 46.5)"/><rect x="55" y="43" width="20" height="7" rx="3.5" fill="#FF4A3D" transform="rotate(-28 65 46.5)"/></g><path d="M50 52l-5 8h10z" fill="#FF4A3D"/></g></g></g><text x="68" y="48" class="disp" font-size="30" font-weight="400" fill="url(#brand)" text-anchor="start" textLength="32" lengthAdjust="spacingAndGlyphs">08</text><text x="110" y="44" class="rnd" font-size="12" font-weight="800" fill="#625E72" text-anchor="start" letter-spacing="2.5">SPECS</text><text x="68" y="86" class="rnd" font-size="22" font-weight="800" fill="#2E2B48" text-anchor="start">技術仕様書</text></svg>
