<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 104" width="838" height="104" role="img"><title>開発技術</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#FFF5DC"/></linearGradient><style>
