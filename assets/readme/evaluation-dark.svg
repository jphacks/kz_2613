<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 268" width="838" height="268" role="img"><title>分担AIの評価（学習に使っていないゲーム、ゲームごとの平均）。GitHub の Unity・Godot の操作定義 57本（生の名前、4組に分けた評価）：カテゴリの正解率88.1%、同じ人の判定94.5%、同じまとまりの再現率91.8%、同じ軸の判定94.6%。ゲームのファイルから読んだ操作 6本（生の名前、1本ずつ外した評価）：カテゴリの正解率76.0%、同じ人の判定89.3%、同じまとまりの再現率75.9%、同じ軸の判定91.5%</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#231B35"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 10)"><rect x="0.75" y="0.75" width="409.5" height="226.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(0.0 0)"><text x="22" y="38" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">GitHub の Unity・Godot の操作定義 57本</text><text x="22" y="60" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">生の名前、4組に分けた評価</text><text x="22" y="100" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">カテゴリの正解率</text><rect x="172" y="92" width="155.0" height="8" rx="4.0" fill="#343B4E"/><rect x="172" y="92" width="136.6" height="8" rx="4.0" fill="url(#brand)"/><text x="389.0" y="100" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="end">88.1%</text><text x="22" y="134" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">同じ人の判定</text><rect x="172" y="126" width="155.0" height="8" rx="4.0" fill="#343B4E"/><rect x="172" y="126" width="146.5" height="8" rx="4.0" fill="url(#brand)"/><text x="389.0" y="134" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="end">94.5%</text><text x="22" y="168" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">同じまとまりの再現率</text><rect x="172" y="160" width="155.0" height="8" rx="4.0" fill="#343B4E"/><rect x="172" y="160" width="142.3" height="8" rx="4.0" fill="url(#brand)"/><text x="389.0" y="168" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="end">91.8%</text><text x="22" y="202" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">同じ軸の判定</text><rect x="172" y="194" width="155.0" height="8" rx="4.0" fill="#343B4E"/><rect x="172" y="194" width="146.6" height="8" rx="4.0" fill="url(#brand)"/><text x="389.0" y="202" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="end">94.6%</text></g><rect x="427.75" y="0.75" width="409.5" height="226.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(427.0 0)"><text x="22" y="38" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">ゲームのファイルから読んだ操作 6本</text><text x="22" y="60" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">生の名前、1本ずつ外した評価</text><text x="22" y="100" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">カテゴリの正解率</text><rect x="172" y="92" width="155.0" height="8" rx="4.0" fill="#343B4E"/><rect x="172" y="92" width="117.8" height="8" rx="4.0" fill="url(#brand)"/><text x="389.0" y="100" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="end">76.0%</text><text x="22" y="134" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">同じ人の判定</text><rect x="172" y="126" width="155.0" height="8" rx="4.0" fill="#343B4E"/><rect x="172" y="126" width="138.4" height="8" rx="4.0" fill="url(#brand)"/><text x="389.0" y="134" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="end">89.3%</text><text x="22" y="168" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">同じまとまりの再現率</text><rect x="172" y="160" width="155.0" height="8" rx="4.0" fill="#343B4E"/><rect x="172" y="160" width="117.6" height="8" rx="4.0" fill="url(#brand)"/><text x="389.0" y="168" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="end">75.9%</text><text x="22" y="202" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">同じ軸の判定</text><rect x="172" y="194" width="155.0" height="8" rx="4.0" fill="#343B4E"/><rect x="172" y="194" width="141.8" height="8" rx="4.0" fill="url(#brand)"/><text x="389.0" y="202" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="end">91.5%</text></g></g></svg>
