ont-weight="600" fill="#2E2B48" text-anchor="start">驚いた瞬間の悲鳴や笑いも全員で</text><text x="34" y="249" class="gh" font-size="15" font-weight="600" fill="#2E2B48" text-anchor="start">共有できる</text></g><rect x="0.75" y="289.75" width="300.5" height="247.5" rx="14" fill="none" stroke="#D8DEE8" stroke-width="1.5"/><g transform="translate(0.0 289)"><rect x="20" y="20" width="44" height="44" rx="12" fill="#5EFF5D"/><rect x="30.0" y="44.0" width="8" height="8" rx="1.5" fill="#FFFFFF"/><rect x="39.0" y="44.0" width="8" height="8" rx="1.5" fill="#FFFFFF"/><rect x="48.0" y="44.0" width="8" height="8" rx="1.5" fill="#FFFFFF"/><rect x="39.0" y="35.0" width="8" height="8" rx="1.5" fill="#FFFFFF"/><rect x="48.0" y="26.0" width="8" height="8" rx="1.5" fill="#FFFFFF"/><text x="78" y="39" class="gh" font-size="17" font-weight="700" fill="#2E2B48" text-anchor="start">パズル・落ち物</text><text x="78" y="60" class="gh" font-size="14.1" font-weight="600" fill="#625E72" text-anchor="start">『テトリス』など</text><rect x="20.5" y="95.5" width="89.4" height="25" rx="13.0" fill="none" stroke="#24C2FA" stroke-width="1.5"/><circle cx="33" cy="108.0" r="4.5" fill="#24C2FA"/><text x="44" y="113.076" class="gh" font-size="14.1" font-weight="600" fill="#2E2B48" text-anchor="start">左右移動</text><rect x="118.9" y="95.5" width="61.2" height="25" rx="13.0" fill="none" stroke="#5EFF5D" stroke-width="1.5"/><circle cx="131.4" cy="108.0" r="4.5" fill="#5EFF5D"/><text x="142.4" y="113.076" class="gh" font-size="14.1" font-weight="600" fill="#2E2B48" text-anchor="start">回転</text><rect x="189.10000000000002" y="95.5" width="61.2" height="25" rx="13.0" fill="none" stroke="#CB00EA" stroke-width="1.5"/><circle cx="201.60000000000002" cy="108.0" r="4.5" fill="#CB00EA"/><text x="212.60000000000002" y="113.076" class="gh" font-size="14.1" font-weight="600" fill="#2E2B48" text-anchor="start">落下</text><rect x="20" y="161" width="3.5" height="78" rx="1.75" fill="url(#brand)"/><text x="34" y="177" class="gh" font-size="15" font-weight="600" f