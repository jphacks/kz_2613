A"/><text x="334.875" y="81.5" class="mono" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">R</text><rect x="14" y="92" width="54.8" height="22" rx="11" fill="#CB00EA" stroke="#CB00EA"/><text x="41.375" y="107.5" class="mono" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wheel</text><path d="M172.0 122l8 8 8-8" fill="none" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1" y="137" width="358" height="116" rx="16" fill="#1B1F2C" stroke="#343B4E"/><text x="14" y="166" class="jp" font-size="20" font-weight="900" fill="url(#brand)" text-anchor="start">②</text><text x="40" y="165" class="jp" font-size="16" font-weight="900" fill="#EEF1F7" text-anchor="start">分担AIが意味と関係を推論</text><text x="40" y="186" class="jp" font-size="12.5" font-weight="700" fill="#AEB4C2" text-anchor="start">MiniLM＋独自の2層Transformer</text><rect x="14" y="202" width="53.5" height="22" rx="11" fill="#151925" stroke="#343B4E"/><text x="40.75" y="217.5" class="jp" font-size="12.5" font-weight="700" fill="#EEF1F7" text-anchor="middle">操作名</text><rect x="73.5" y="202" width="111.2" height="22" rx="11" fill="#151925" stroke="#343B4E"/><text x="129.125" y="217.5" class="jp" font-size="12.5" font-weight="700" fill="#EEF1F7" text-anchor="middle">→ 意味ベクトル</text><rect x="190.75" y="202" width="61.2" height="22" rx="11" fill="#151925" stroke="#343B4E"/><text x="221.375" y="217.5" class="jp" font-size="12.5" font-weight="700" fill="#EEF1F7" text-anchor="middle">→ 分担</text><path d="M172.0 258l8 8 8-8" fill="none" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1" y="273" width="358" height="116" rx="16" fill="#1B1F2C" stroke="#343B4E"/><text x="14" y="302" class="jp" font-size="20" font-weight="900" fill="url(#brand)" text-anchor="start">③</text><text x="40" y="301" class="jp" font-size="16" font-weight="900" fill="#EEF1F7" text-anchor="start">スマホ画面へ自動で配分</text><text x="40" y="322" class="jp" font-size="12.5" font-weight="700" fill="#AEB4C2" text-anchor="start">Rustでオフライン推論・約80ms</text><g transform="translate(10.6 332.0) scale(0.2480)"><g class="bob" style="animation-delay:0.00s"><path d="M12 4C38 12 62 12 88 4C97 1 103 8 101 18C95 55 95 95 101 132C103 142 97 149 88 146C62 138 38 138 12 146C3 149-3 142-1 132C5 95 5 55-1 18C-3 8 3 1 12 4Z" fill="#24C2FA" stroke="#0A0A0A" stroke-width="1.4"/><rect x="14" y="16" width="72" height="117" rx="11" fill="#05060A"/><g filter="url(#glow)" transform="translate(0 6)"><g class="eyes" style="animation-delay:0.00s"><circle cx="37" cy="46" r="8.5" fill="#19F6FF"/><circle cx="63" cy="46" r="8.5" fill="#19F6FF"/></g><path d="M45 56l5 5 5-5" fill="none" stroke="#19F6FF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><text x="40" y="350" class="jp" font-size="12" font-weight="900" fill="#24C2FA" text-anchor="start">P1</text><text x="40" y="368" class="jp" font-size="13" font-weight="800" fill="#EEF1F7" text-anchor="start">移動</text><g transform="translate(122.6 332.0) scale(0.2480)"><g class="bob" style="animation-delay:0.40s"><path d="M12 4C38 12 62 12 88 4C97 1 103 8 101 18C95 55 95 95 101 132C103 142 97 149 88 146C62 138 38 138 12 146C3 149-3 142-1 132C5 95 5 55-1 18C-3 8 3 1 12 4Z" fill="#5EFF5D" stroke="#0A0A0A" stroke-width="1.4"/><rect x="14" y="16" width="72" height="117" rx="11" fill="#05060A"/><g filter="url(#glow)" transform="translate(0 6)"><g class="eyes" style="animation-delay:0.68s"><rect x="29" y="37" width="15" height="14" rx="2.5" fill="#86FF55"/><rect x="56" y="37" width="15" height="14" rx="2.5" fill="#86FF55"/></g><rect x="44" y="56" width="12" height="5" rx="2.5" fill="#86FF55"/></g></g></g><text x="152" y="350" class="jp" font-size="12" font-weight="900" fill="#2FB52E" text-anchor="start">P2</text><text x="152" y="368" class="jp" font-size="13" font-weight="800" fill="#EEF1F7" text-anchor="start">視点</text><g transform="translate(234.6 332.0) scale(0.2480)"><g class="bob" style="animation-delay:0.80s"><path d="M12 4C38 12 62 12 88 4C97 1 103 8 101 18C95 55 95 95 101 132C103 142 97 149 88 146C62 138 38 138 12 146C3 149-3 142-1 132C5 95 5 55-1 18C-3 8 3 1 12 4Z" fill="#CB00EA" stroke="#0A0A0A" stroke-width="1.4"/><rect x="14" y="16" width="72" height="117" rx="11" fill="#05060A"/><g filter="url(#glow)" transform="translate(0 6)"><g class="eyes" style="animation-delay:1.36s"><rect x="25" y="45" width="19" height="7" rx="3.5" fill="#DC45FF"/><rect x="56" y="45" width="19" height="7" rx="3.5" fill="#DC45FF"/></g><path d="M50 53l-5.5 9h11z" fill="#DC45FF"/></g></g></g><text x="264" y="350" class="jp" font-size="12" font-weight="900" fill="#CB00EA" text-anchor="start">P3</text><text x="264" y="368" class="jp" font-size="13" font-weight="800" fill="#EEF1F7" text-anchor="start">アクション</text></svg>
