<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 642" width="324" height="642" role="img"><title>分担AIの評価（学習に使っていないゲーム、ゲームごとの平均）。GitHub の Unity・Godot の操作定義 57本（生の名前、4組に分けた評価）：カテゴリの正解率88.1%、同じ人の判定94.5%、同じまとまりの再現率91.8%、同じ軸の判定94.6%。ゲームのファイルから読んだ操作 6本（生の名前、1本ずつ外した評価）：カテゴリの正解率76.0%、同じ人の判定89.3%、同じまとまりの再現率75.9%、同じ軸の判定91.5%</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#FFF5DC"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 10)"><rect x="0.75" y="0.75" width="322.5" height="304.5" rx="14" fill="none" stroke="#D8DEE8" stroke-width="1.5"/><g transform="translate(0 0)"><text x="22" y="38" class="gh" font-size="15" font-weight="700" fill="#2E2B48" text-anchor="start">GitHub の Unity・Godot の操作定義</text><text x="22" y="60" class="gh" font-size="15" font-weight="700" fill="#2E2B48" text-anchor="start"> 57本</text><text x="22" y="82" class="gh" font-size="13" font-weight="600" fill="#625E72" text-anchor="start">生の名前、4組に分けた評価</text><text x="22" y="116" class="gh" font-size="13" font-weight="600" fill="#2E2B48" text-anchor="start">カテゴリの正解率</text><text x="302" y="116" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="end">88.1%</text><rect x="22" y="126" width="280" height="8" rx="4.0" fill="#D8DEE8"/><rect x="22" y="126" width="246.7" height="8" rx="4.0" fill="url(#brand)"/><text x="22" y="164" class="gh" font-size="13" font-weight="600" fill="#2E2B48" text-anchor="start">同じ人の判定</text><text x="302" y="164" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="end">94.5%</text><rect x="22" y="174" width="280" height="8" rx="4.0" fill="#D8DEE8"/><rect x="22" y="174" width="264.6" height="8" rx="4.0" fill="url(#brand)"/><text x="22" y="212" class="gh" font-size="13" font-weight="600" fill="#2E2B48" text-anchor="start">同じまとまりの再現率</text><text x="302" y="212" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="end">91.8%</text><rect x="22" y="222" width="280" height="8" rx="4.0" fill="#D8DEE8"/><rect x="22" y="222" width="257.0" height="8" rx="4.0" fill="url(#brand)"/><text x="22" y="260" class="gh" font-size="13" font-weight="600" fill="#2E2B48" text-anchor="start">同じ軸の判定</text><text x="302" y="260" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="end">94.6%</text><rect x="22" y="270" width="280" height="8" rx="4.0" fill="#D8DEE8"/><rect x="22" y="270" width="264.9" height="8" rx="4.0" fill="url(#brand)"/></g><rect x="0.75" y="318.75" width="322.5" height="282.5" rx="14" fill="none" stroke="#D8DEE8" stroke-width="1.5"/><g transform="translate(0 318)"><text x="22" y="38" class="gh" font-size="15" font-weight="700" fill="#2E2B48" text-anchor="start">ゲームのファイルから読んだ操作 6本</text><text x="22" y="60" class="gh" font-size="13" font-weight="600" fill="#625E72" text-anchor="start">生の名前、1本ずつ外した評価</text><text x="22" y="94" class="gh" font-size="13" font-weight="600" fill="#2E2B48" text-anchor="start">カテゴリの正解率</text><text x="302" y="94" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="end">76.0%</text><rect x="22" y="104" width="280" height="8" rx="4.0" fill="#D8DEE8"/><rect x="22" y="104" width="212.8" height="8" rx="4.0" fill="url(#brand)"/><text x="22" y="142" class="gh" font-size="13" font-weight="600" fill="#2E2B48" text-anchor="start">同じ人の判定</text><text x="302" y="142" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="end">89.3%</text><rect x="22" y="152" width="280" height="8" rx="4.0" fill="#D8DEE8"/><rect x="22" y="152" width="250.0" height="8" rx="4.0" fill="url(#brand)"/><text x="22" y="190" class="gh" font-size="13" font-weight="600" fill="#2E2B48" text-anchor="start">同じまとまりの再現率</text><text x="302" y="190" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="end">75.9%</text><rect x="22" y="200" width="280" height="8" rx="4.0" fill="#D8DEE8"/><rect x="22" y="200" width="212.5" height="8" rx="4.0" fill="url(#brand)"/><text x="22" y="238" class="gh" font-size="13" font-weight="600" fill="#2E2B48" text-anchor="start">同じ軸の判定</text><text x="302" y="238" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="end">91.5%</text><rect x="22" y="248" width="280" height="8" rx="4.0" fill="#D8DEE8"/><rect x="22" y="248" width="256.2" height="8" rx="4.0" fill="url(#brand)"/></g></g></svg>
