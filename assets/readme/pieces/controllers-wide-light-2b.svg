<svg xmlns="http://www.w3.org/2000/svg" viewBox="283.81 78.00 554.19 47.00" width="554.19" height="47.00" role="img"><title>3人で『Minecraft』を遊ぶ場合の分担と、実際のスマホの画面。P1（移動・ホスト）：移動・ジャンプ・スニーク・ダッシュ。画面は8方向スティック＋アクションボタン。P2（視点）：視点・カメラ操作。画面は感度調整つきドラッグパッド。P3（アクション）：攻撃・ブロック設置・持ち物切替・インベントリ。画面は左右クリック・ホイール・キーボタン</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#FFF5DC"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 10)"><text x="0" y="18" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="start">例：3人で『Minecraft』を遊ぶ場合</text><text x="0" y="40" class="gh" font-size="13" font-weight="600" fill="#625E72" text-anchor="start">各スマホには、担当する操作だけを並べたコントローラーが表示されます（実際の画面）。</text><rect x="0" y="56" width="824" height="1.5" rx=".75" fill="#D8DEE8"/><rect x="70.03333333333335" y="80" width="35.6" height="24" rx="12.0" fill="#24C2FA"/><text x="87.83333333333334" y="96.68" class="gh" font-size="13" font-weight="700" fill="#06243A" text-anchor="middle">P1</text><text x="115.63333333333335" y="98" class="gh" font-size="18" font-weight="700" fill="#2E2B48" text-anchor="start">移動</text><text x="159.63333333333335" y="97" class="gh" font-size="13" font-weight="600" fill="#625E72" text-anchor="start">ホスト</text><rect x="26.1" y="185.6" width="2" height="29.1" rx="1" fill="#2A2E38"/><rect x="240.5" y="171.0" width="2" height="43.7" rx="1" fill="#2A2E38"/><rect x="27.3" y="120.0" width="214.0" height="364.2" rx="32.1" fill="#16181F" stroke="#2A2E38" stroke-width="1.2"/><clipPath id="scr1"><rect x="37.0" y="129.6" width="194.7" height="345.0" rx="22.5"/></clipPath><circle cx="134.3" cy="140.2" r="3.9" fill="#16181F"/><text x="134.33333333333334" y="516.228" class="gh" font-size="14" font-weight="600" fill="#2E2B48" text-anchor="middle">移動・ジャンプ・スニーク・ダッシュ</text><text x="134.33333333333334" y="543.228" class="gh" font-size="13" font-weight="400" fill="#625E72" text-anchor="middle">8方向スティック＋アクションボタン</text><rect x="378.2" y="80" width="35.6" height="24" rx="12.0" fill="#5EFF5D"/><text x="396.0" y="96.68" class="gh" font-size="13" font-weight="700" fill="#0C3A0C" text-anchor="middle">P2</text><text x="423.8" y="98" class="gh" font-size="18" font-weight="700" fill="#2E2B48" text-anchor="start">視点</text><rect x="310.8" y="185.6" width="2" height="29.1" rx="1" fill="#2A2E38"/><rect x="525.2" y="171.0" width="2" height="43.7" rx="1" fill="#2A2E38"/><rect x="312.0" y="120.0" width="214.0" height="364.2" rx="32.1" fill="#16181F" stroke="#2A2E38" stroke-width="1.2"/><clipPath id="scr2"><rect x="321.6" y="129.6" width="194.7" height="345.0" rx="22.5"/></clipPath><circle cx="419.0" cy="140.2" r="3.9" fill="#16181F"/><text x="419.0" y="516.228" class="gh" font-size="14" font-weight="600" fill="#2E2B48" text-anchor="middle">視点・カメラ操作</text><text x="419.0" y="543.228" class="gh" font-size="13" font-weight="400" fill="#625E72" text-anchor="middle">感度調整つきドラッグパッド</text><rect x="635.8666666666668" y="80" width="35.6" height="24" rx="12.0" fill="#CB00EA"/><text x="653.6666666666667" y="96.68" class="gh" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">P3</text><text x="681.4666666666668" y="98" class="gh" font-size="18" font-weight="700" fill="#2E2B48" text-anchor="start">アクション</text><rect x="595.5" y="185.6" width="2" height="29.1" rx="1" fill="#2A2E38"/><rect x="809.9" y="171.0" width="2" height="43.7" rx="1" fill="#2A2E38"/><rect x="596.7" y="120.0" width="214.0" height="364.2" rx="32.1" fill="#16181F" stroke="#2A2E38" stroke-width="1.2"/><clipPath id="scr3"><rect x="606.3" y="129.6" width="194.7" height="345.0" rx="22.5"/></clipPath><circle cx="703.7" cy="140.2" r="3.9" fill="#16181F"/><text x="703.6666666666667" y="516.228" class="gh" font-size="14" font-weight="600" fill="#2E2B48" text-anchor="middle">攻撃・ブロック設置・持ち物切替・</text><text x="703.6666666666667" y="537.228" class="gh" font-size="14" font-weight="600" fill="#2E2B48" text-anchor="middle">インベントリ</text><text x="703.6666666666667" y="564.228" class="gh" font-size="13" font-weight="400" fill="#625E72" text-anchor="middle">左右クリック・ホイール・キーボタン</text></g></svg>
