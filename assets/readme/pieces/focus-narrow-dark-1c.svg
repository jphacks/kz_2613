<svg xmlns="http://www.w3.org/2000/svg" viewBox="220.36 0.00 108.86 206.00" width="108.86" height="206.00" role="img"><title>注力したこと。1：スマホだけで準備から開始まで（P1のスマホがタッチパッド付きのリモコンになる）。2：持ち方に合わせるUI編集（ボタンの位置と縦横のサイズを、各スマホで変えられる）。3：違和感のない低遅延。Wi-Fiの往復遅延9.0ms（実機の測定・中央値）。スマホの操作からPC入力まで26.0ms（推定遅延・中央値）</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#231B35"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 10)"><rect x="-1.2" y="34.7" width="2" height="15.4" rx="1" fill="#4A5062"/><rect x="109.2" y="27.0" width="2" height="23.1" rx="1" fill="#4A5062"/><rect x="0.0" y="0.0" width="110.0" height="192.7" rx="16.5" fill="#16181F" stroke="#4A5062" stroke-width="1.2"/><clipPath id="scr23"><rect x="5.0" y="5.0" width="100.1" height="182.8" rx="11.6"/></clipPath><circle cx="55.0" cy="10.4" r="2.2" fill="#16181F"/><text x="126" y="34" class="disp" font-size="26" font-weight="400" fill="url(#brand)" text-anchor="start">01</text><text x="126" y="62" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="start">スマホだけで準備</text><text x="126" y="85" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="start">から開始まで</text><text x="126" y="114" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">P1のスマホがタッチパッド付きの</text><text x="126" y="134" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">リモコンになる</text><rect x="-1.2" y="249.4" width="2" height="15.4" rx="1" fill="#4A5062"/><rect x="109.2" y="241.7" width="2" height="23.1" rx="1" fill="#4A5062"/><rect x="0.0" y="214.7" width="110.0" height="192.7" rx="16.5" fill="#16181F" stroke="#4A5062" stroke-width="1.2"/><clipPath id="scr24"><rect x="5.0" y="219.7" width="100.1" height="182.8" rx="11.6"/></clipPath><circle cx="55.0" cy="225.1" r="2.2" fill="#16181F"/><text x="126" y="248.70166666666665" class="disp" font-size="26" font-weight="400" fill="url(#brand)" text-anchor="start">02</text><text x="126" y="276.70166666666665" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="start">持ち方に合わせるUI編集</text><text x="126" y="305.70166666666665" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">ボタンの位置と縦横のサイズを、</text><text x="126" y="325.70166666666665" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">各スマホで変えられる</text><rect x="0.75" y="430.1533333333333" width="322.5" height="324.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><text x="22" y="467.4033333333333" class="disp" font-size="26" font-weight="400" fill="url(#brand)" text-anchor="start">03</text><text x="62" y="465.4033333333333" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="start">違和感のない低遅延</text><text x="22" y="549.4033333333333" class="disp" font-size="52" font-weight="400" fill="url(#brand)" text-anchor="start">9.0</text><text x="89.36" y="549.4033333333333" class="gh" font-size="20" font-weight="700" fill="#AEB4C2" text-anchor="start">ms</text><text x="22" y="575.4033333333333" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">Wi-Fiの往復遅延</text><text x="22" y="597.4033333333333" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">実機の測定・中央値</text><text x="22" y="681.4033333333333" class="disp" font-size="52" font-weight="400" fill="url(#brand)" text-anchor="start">26.0</text><text x="114.32" y="681.4033333333333" class="gh" font-size="20" font-weight="700" fill="#AEB4C2" text-anchor="start">ms</text><text x="22" y="707.4033333333333" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">スマホの操作からPC入力まで</text><text x="22" y="729.4033333333333" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">推定遅延・中央値</text></g></svg>
