<svg xmlns="http://www.w3.org/2000/svg" viewBox="111.50 221.00 108.86 207.00" width="108.86" height="207.00" role="img"><title>注力したこと。1：スマホだけで準備から開始まで（P1のスマホがタッチパッド付きのリモコンになる）。2：持ち方に合わせるUI編集（ボタンの位置と縦横のサイズを、各スマホで変えられる）。3：違和感のない低遅延。Wi-Fiの往復遅延9.0ms（実機の測定・中央値）。スマホの操作からPC入力まで26.0ms（推定遅延・中央値）</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#FFF5DC"/></linearGradient><style>
