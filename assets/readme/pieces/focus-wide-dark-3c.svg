<svg xmlns="http://www.w3.org/2000/svg" viewBox="560.91 372.00 277.09 101.00" width="277.09" height="101.00" role="img"><title>注力したこと。1：スマホだけで準備から開始まで（P1のスマホがタッチパッド付きのリモコンになる）。2：持ち方に合わせるUI編集（ボタンの位置と縦横のサイズを、各スマホで変えられる）。3：違和感のない低遅延。Wi-Fiの往復遅延9.0ms（実機の測定・中央値）。スマホの操作からPC入力まで26.0ms（推定遅延・中央値）</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#231B35"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 10)"><rect x="0.75" y="0.75" width="267.1666666666667" height="455.808" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><rect x="285.4166666666667" y="0.75" width="267.1666666666667" height="455.808" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><rect x="570.0833333333334" y="0.75" width="267.1666666666667" height="455.808" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><rect x="49.1" y="111.0" width="2" height="23.5" rx="1" fill="#4A5062"/><rect x="217.5" y="99.2" width="2" height="35.3" rx="1" fill="#4A5062"/><rect x="50.3" y="58.0" width="168.0" height="294.3" rx="25.2" fill="#16181F" stroke="#4A5062" stroke-width="1.2"/><clipPath id="scr21"><rect x="57.9" y="65.6" width="152.9" height="279.2" rx="17.6"/></clipPath><circle cx="134.3" cy="73.9" r="3.0" fill="#16181F"/><text x="134.33333333333334" y="40" class="disp" font-size="28" font-weight="400" fill="url(#brand)" text-anchor="middle">01</text><text x="134.33333333333334" y="386.308" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="middle">スマホだけで準備から開始まで</text><text x="134.33333333333334" y="413.308" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="middle">P1のスマホがタッチパッド付きのリモ</text><text x="134.33333333333334" y="433.308" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="middle">コンになる</text><rect x="333.8" y="111.0" width="2" height="23.5" rx="1" fill="#4A5062"/><rect x="502.2" y="99.2" width="2" height="35.3" rx="1" fill="#4A5062"/><rect x="335.0" y="58.0" width="168.0" height="294.3" rx="25.2" fill="#16181F" stroke="#4A5062" stroke-width="1.2"/><clipPath id="scr22"><rect x="342.6" y="65.6" width="152.9" height="279.2" rx="17.6"/></clipPath><circle cx="419.0" cy="73.9" r="3.0" fill="#16181F"/><text x="419.0" y="40" class="disp" font-size="28" font-weight="400" fill="url(#brand)" text-anchor="middle">02</text><text x="419.0" y="386.308" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="middle">持ち方に合わせるUI編集</text><text x="419.0" y="413.308" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="middle">ボタンの位置と縦横のサイズを、</text><text x="419.0" y="433.308" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="middle">各スマホで変えられる</text><text x="597.3333333333334" y="102" class="disp" font-size="52" font-weight="400" fill="url(#brand)" text-anchor="start">9.0</text><text x="664.6933333333334" y="102" class="gh" font-size="20" font-weight="700" fill="#AEB4C2" text-anchor="start">ms</text><text x="597.3333333333334" y="128" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">Wi-Fiの往復遅延</text><text x="597.3333333333334" y="150" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">実機の測定・中央値</text><text x="597.3333333333334" y="234" class="disp" font-size="52" font-weight="400" fill="url(#brand)" text-anchor="start">26.0</text><text x="689.6533333333334" y="234" class="gh" font-size="20" font-weight="700" fill="#AEB4C2" text-anchor="start">ms</text><text x="597.3333333333334" y="260" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">スマホの操作からPC入力まで</text><text x="597.3333333333334" y="282" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">推定遅延・中央値</text><text x="703.6666666666667" y="40" class="disp" font-size="28" font-weight="400" fill="url(#brand)" text-anchor="middle">03</text><text x="703.6666666666667" y="386.308" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="middle">違和感のない低遅延</text><text x="703.6666666666667" y="413.308" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="middle">PCのWi-Fiにスマホが直接つながる</text></g></svg>
