<svg xmlns="http://www.w3.org/2000/svg" viewBox="111.50 79.00 508.50 209.00" width="508.50" height="209.00" role="img"><title>3人で『Minecraft』を遊ぶ場合の分担と、実際のスマホの画面。P1（移動・ホスト）：移動・ジャンプ・スニーク・ダッシュ。画面は8方向スティック＋アクションボタン。P2（視点）：視点・カメラ操作。画面は感度調整つきドラッグパッド。P3（アクション）：攻撃・ブロック設置・持ち物切替・インベントリ。画面は左右クリック・ホイール・キーボタン</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#231B35"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 10)"><text x="0" y="18" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="start">例：3人で『Minecraft』を遊ぶ場合</text><text x="0" y="40" class="gh" font-size="14.1" font-weight="600" fill="#AEB4C2" text-anchor="start">各スマホには、担当する操作だけを並べたコントローラーが表示されます（実際の画面）。</text><rect x="0" y="56" width="606" height="1.5" rx=".75" fill="#343B4E"/><rect x="-1.2" y="113.7" width="2" height="15.0" rx="1" fill="#4A5062"/><rect x="109.2" y="106.2" width="2" height="22.5" rx="1" fill="#4A5062"/><rect x="0.0" y="80.0" width="110.0" height="187.2" rx="16.5" fill="#16181F" stroke="#4A5062" stroke-width="1.2"/><clipPath id="scr31"><rect x="5.0" y="85.0" width="100.1" height="177.3" rx="11.6"/></clipPath><circle cx="55.0" cy="90.4" r="2.2" fill="#16181F"/><rect x="126" y="88" width="35.6" height="24" rx="12.0" fill="#24C2FA"/><text x="143.8" y="104.68" class="gh" font-size="14.1" font-weight="700" fill="#06243A" text-anchor="middle">P1</text><text x="171.6" y="106" class="gh" font-size="18" font-weight="700" fill="#EEF1F7" text-anchor="start">移動</text><text x="215.6" y="105" class="gh" font-size="14.1" font-weight="600" fill="#AEB4C2" text-anchor="start">ホスト</text><text x="126" y="142" class="gh" font-size="14.1" font-weight="600" fill="#EEF1F7" text-anchor="start">移動・ジャンプ・スニーク・ダッシュ</text><text x="126" y="171" class="gh" font-size="14.1" font-weight="400" fill="#AEB4C2" text-anchor="start">8方向スティック＋アクションボタン</text><rect x="-1.2" y="322.9" width="2" height="15.0" rx="1" fill="#4A5062"/><rect x="109.2" y="315.4" width="2" height="22.5" rx="1" fill="#4A5062"/><rect x="0.0" y="289.2" width="110.0" height="187.2" rx="16.5" fill="#16181F" stroke="#4A5062" stroke-width="1.2"/><clipPath id="scr32"><rect x="5.0" y="294.2" width="100.1" height="177.3" rx="11.6"/></clipPath><circle cx="55.0" cy="299.6" r="2.2" fill="#16181F"/><rect x="126" y="297.21999999999997" width="35.6" height="24" rx="12.0" fill="#5EFF5D"/><text x="143.8" y="313.9" class="gh" font-size="14.1" font-weight="700" fill="#0C3A0C" text-anchor="middle">P2</text><text x="171.6" y="315.21999999999997" class="gh" font-size="18" font-weight="700" fill="#EEF1F7" text-anchor="start">視点</text><text x="126" y="351.21999999999997" class="gh" font-size="14.1" font-weight="600" fill="#EEF1F7" text-anchor="start">視点・カメラ操作</text><text x="126" y="380.21999999999997" class="gh" font-size="14.1" font-weight="400" fill="#AEB4C2" text-anchor="start">感度調整つきドラッグパッド</text><rect x="-1.2" y="532.1" width="2" height="15.0" rx="1" fill="#4A5062"/><rect x="109.2" y="524.7" width="2" height="22.5" rx="1" fill="#4A5062"/><rect x="0.0" y="498.4" width="110.0" height="187.2" rx="16.5" fill="#16181F" stroke="#4A5062" stroke-width="1.2"/><clipPath id="scr33"><rect x="5.0" y="503.4" width="100.1" height="177.3" rx="11.6"/></clipPath><circle cx="55.0" cy="508.8" r="2.2" fill="#16181F"/><rect x="126" y="506.43999999999994" width="35.6" height="24" rx="12.0" fill="#CB00EA"/><text x="143.8" y="523.1199999999999" class="gh" font-size="14.1" font-weight="700" fill="#FFFFFF" text-anchor="middle">P3</text><text x="171.6" y="524.4399999999999" class="gh" font-size="18" font-weight="700" fill="#EEF1F7" text-anchor="start">アクション</text><text x="126" y="560.4399999999999" class="gh" font-size="14.1" font-weight="600" fill="#EEF1F7" text-anchor="start">攻撃・ブロック設置・持ち物切替・インベントリ</text><text x="126" y="589.4399999999999" class="gh" font-size="14.1" font-weight="400" fill="#AEB4C2" text-anchor="start">左右クリック・ホイール・キーボタン</text></g></svg>
