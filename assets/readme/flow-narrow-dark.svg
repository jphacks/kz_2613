ill="#EEF1F7" text-anchor="middle">AIが操作を分担</text><text x="156.0" y="241" class="jp" font-size="16.5" font-weight="700" fill="#AEB4C2" text-anchor="middle">独自AIが2〜4人へ配分。</text><text x="156.0" y="265" class="jp" font-size="16.5" font-weight="700" fill="#AEB4C2" text-anchor="middle">担当を確かめて起動</text></g><path d="M147.0 885l9 9 9-9" fill="none" stroke="url(#brand)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0 900)"><rect x="20" y="10" width="272" height="270" rx="22" fill="#1B1F2C" stroke="#343B4E"/><circle cx="56" cy="44" r="18" fill="#FF1D00"/><text x="56" y="51" class="disp" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="middle">4</text><text x="84" y="51" class="mono" font-size="16" font-weight="700" fill="#AEB4C2" text-anchor="start">STEP 4</text><g transform="translate(88.4 76.0) scale(0.6117)"><g class="bob" style="animation-delay:1.20s"><path d="M12 4C38 12 62 12 88 4C97 1 103 8 101 18C95 55 95 95 101 132C103 142 97 149 88 146C62 138 38 138 12 146C3 149-3 142-1 132C5 95 5 55-1 18C-3 8 3 1 12 4Z" fill="#FF1D00" stroke="#0A0A0A" stroke-width="1.4"/><rect x="14" y="16" width="72" height="117" rx="11" fill="#05060A"/><g filter="url(#glow)" transform="translate(0 6)"><g class="eyes" style="animation-delay:2.04s"><rect x="25" y="43" width="20" height="7" rx="3.5" fill="#FF4A3D" transform="rotate(28 35 46.5)"/><rect x="55" y="43" width="20" height="7" rx="3.5" fill="#FF4A3D" transform="rotate(-28 65 46.5)"/></g><path d="M50 52l-5 8h10z" fill="#FF4A3D"/></g></g></g><rect x="170.0" y="104" width="56" height="56" rx="14" fill="#FF1D00"/><path d="M191.0 119L213.0 132L191.0 145Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><text x="156.0" y="210" class="jp" font-size="25" font-weight="900" fill="#EEF1F7" text-anchor="middle">開始ボタンでプレイ</text><text x="156.0" y="241" class="jp" font-size="16.5" font-weight="700" fill="#AEB4C2" text-anchor="middle">ホストが「分担操作開始」。</text><text x="156.0" y="26