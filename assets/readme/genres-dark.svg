<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 436" width="838" height="436" role="img"><title>ジャンルと分担の例。3D空間を動くゲーム（『Minecraft』など）：分担は移動・ジャンプ／視点・カメラ／攻撃・アイテム使用。狙った場所へ進むだけでも声掛けが要り、見慣れたワールドでの冒険や建築が共同作業になる。ホラー・サバイバルホラー（『Outlast』『バイオハザード』など）：分担は移動／視点・照準／ライト・攻撃。1人では足がすくむ場面も、声を掛け合いながら進める。驚いた瞬間の悲鳴や笑いも全員で共有できる。パズル・落ち物（『テトリス』など）：分担は左右移動／回転／落下。「右！」「今、回して！」と息を合わせる、テンポの速いパーティーゲームになる。レース・ドライブ：分担はハンドル／アクセル・ブレーキ／視点・ライト・ギア。まっすぐ走るだけでも、互いの呼吸を合わせる必要がある</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#231B35"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><rect x="0.75" y="0.75" width="409.5" height="208.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(0.0 0)"><rect x="20" y="20" width="44" height="44" rx="12" fill="#24C2FA"/><path d="M42.0 29.0l12 6.5v14L42.0 56.0l-12-6.5v-14z" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"/><path d="M30.0 35.5L42.0 42.0l12-6.5M42.0 42.0v14" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"/><text x="78" y="39" class="gh" font-size="17" font-weight="700" fill="#EEF1F7" text-anchor="start">3D空間を動くゲーム</text><text x="78" y="60" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">『Minecraft』など</text><rect x="20.5" y="80.5" width="124.0" height="25" rx="13.0" fill="none" stroke="#24C2FA" stroke-width="1.5"/><circle cx="33" cy="93.0" r="4.5" fill="#24C2FA"/><text x="44" y="97.68" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">移動・ジャンプ</text><rect x="153.5" y="80.5" width="111.0" height="25" rx="13.0" fill="none" stroke="#5EFF5D" stroke-width="1.5"/><circle cx="166.0" cy="93.0" r="4.5" fill="#5EFF5D"/><text x="177.0" y="97.68" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">視点・カメラ</text><rect x="20.5" y="114.5" width="150.0" height="25" rx="13.0" fill="none" stroke="#CB00EA" stroke-width="1.5"/><circle cx="33" cy="127.0" r="4.5" fill="#CB00EA"/><text x="44" y="131.68" class="gh" font-size="13" font-weight="600" fill="#EEF1F7" text-anchor="start">攻撃・アイテム使用</text><rect x="20" y="146" width="3.5" height="54" rx="1.75" fill="url(#brand)"/><text x="34" y="162" class="gh" font-size="15" font-weight="600" fill="#EEF1F7" text-anchor="start">狙った場所へ進むだけでも声掛けが要り、</text><text x="34" y="186" class="gh" font-size="15" font-weight="600" fill="#EEF1F7" text-anchor="start">見慣れたワールドでの冒険や建築が共同作業になる</text></g><rect x="427.75" y="0.75" width="409.5" height="208.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g tran