<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 628" width="460" height="628" role="img"><title>特長。1：1つのキャラクターを2〜4人で分担する。移動・視点・アクションなどを分け合い、各スマホには自分の担当操作だけが並びます。ボタンの位置や大きさは持ち方に合わせて変えられ、60秒ごとに担当が入れ替わる交代ルールも選べます。。2：選んだゲームがそのまま協力ゲームになる。PCに入っているゲームを選ぶだけで、その操作に合った分担とコントローラーをその場で用意します。特定のタイトルに限らず、手元のPCゲームで共同操作を楽しめます。。3：専用の機器もアプリも要らない。Android・iPhoneの標準ブラウザでQRコードを読み取れば参加できます。ホストのスマホがリモコンになるので、PCのキーボードとマウスに触らずに、ゲーム選びから開始まで進められます。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#231B35"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 10)"><rect x="0.75" y="0.75" width="458.5" height="186.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(0 0)"><g transform="translate(22 18) scale(.86)"><rect x="0" y="0" width="56" height="56" rx="14" fill="#CB00EA"/><path d="M28 28L28.0 10.0A18 18 0 0 1 43.6 37.0Z" fill="#24C2FA" stroke="#CB00EA" stroke-width="2"/><path d="M28 28L43.6 37.0A18 18 0 0 1 12.4 37.0Z" fill="#5EFF5D" stroke="#CB00EA" stroke-width="2"/><path d="M28 28L12.4 37.0A18 18 0 0 1 28.0 10.0Z" fill="#FFFFFF" stroke="#CB00EA" stroke-width="2"/></g><path d="M424.03 40.19Q421.4 40.19 419.97 38.71Q418.53 37.24 418.53 34.46V25.09Q418.53 22.16 419.89 20.6Q421.26 19.03 424.03 19.03Q426.82 19.03 428.18 20.6Q429.53 22.16 429.53 25.09V34.46Q429.53 37.24 428.11 38.71Q426.68 40.19 424.03 40.19ZM424.03 36.36Q424.52 36.36 424.79 35.93Q425.06 35.49 425.06 34.95V24.69Q425.06 23.95 424.9 23.41Q424.74 22.86 424.03 22.86Q423.32 22.86 423.16 23.41Q423.01 23.95 423.01 24.69V34.95Q423.01 35.49 423.28 35.93Q423.56 36.36 424.03 36.36ZM432.88 40V23.99Q432.45 24.5 431.71 24.81Q430.96 25.12 430.3 25.12V21.81Q430.93 21.71 431.65 21.4Q432.37 21.09 432.99 20.54Q433.61 19.99 433.94 19.21H437.28V40Z" fill="url(#brand)"><title>01</title></path><text x="84" y="30" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="start">1つのキャラクターを</text><text x="84" y="53" class="gh" font-size="16" font-weight="700" fill="#EEF1F7" text-anchor="start">2〜4人で分担する</text><text x="22" y="100" class="gh" font-size="14.8" font-weight="400" fill="#AEB4C2" text-anchor="start">移動・視点・アクションなどを分け合い、各スマホには自分の</text><text x="22" y="122" class="gh" font-size="14.8" font-weight="400" fill="#AEB4C2" text-anchor="start">担当操作だけが並びます。ボタンの位置や大きさは持ち方に</text><text x="22" y="144" class="gh" font-size="14.8" font-weight="400" fill="#AEB4C2" text-anchor="start">合わせて変えられ、60秒ごとに担当が入れ替わる</text><text x="22" y="166" class="gh" font-size="14.8" font-weight="400" fill="#AEB4C2" text-a