ムになる</text><text x="22" y="100" class="gh" font-size="14.8" font-weight="400" fill="#AEB4C2" text-anchor="start">PCに入っているゲームを選ぶだけで、その操作に合った</text><text x="22" y="122" class="gh" font-size="14.8" font-weight="400" fill="#AEB4C2" text-anchor="start">分担とコントローラーをその場で用意します。</text><text x="22" y="144" class="gh" font-size="14.8" font-weight="400" fill="#AEB4C2" text-anchor="start">特定のタイトルに限らず、手元のPCゲームで共同操作を</text><text x="22" y="166" class="gh" font-size="14.8" font-weight="400" fill="#AEB4C2" text-anchor="start">楽しめます。</text></g><rect x="0.75" y="400.75" width="458.5" height="186.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(0 400)"><g transform="translate(22 18) scale(.86)"><rect x="0" y="0" width="56" height="56" rx="14" fill="#24C2FA"/><rect x="8" y="8" width="16" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="3"/><rect x="13" y="13" width="6" height="6" fill="#FFFFFF"/><rect x="32" y="8" width="16" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="3"/><rect x="37" y="13" width="6" height="6" fill="#FFFFFF"/><rect x="8" y="32" width="16" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="3"/><rect x="13" y="37" width="6" height="6" fill="#FFFFFF"/><rect x="34" y="34" width="6" height="6" fill="#FFFFFF"/><rect x="42" y="42" width="6" height="6" fill="#FFFFFF"/><rect x="34" y="44" width="6" height="6" fill="#FFFFFF"/><rect x="44" y="33" width="6" height="6" fill="#FFFFFF"/></g><path d="M420.08 40.19Q417.44 40.19 416.01 38.71Q414.58 37.24 414.58 34.46V25.09Q414.58 22.16 415.94 20.6Q417.3 19.03 420.08 19.03Q422.86 19.03 424.22 20.6Q425.58 22.16 425.58 25.09V34.46Q425.58 37.24 424.15 38.71Q422.72 40.19 420.08 40.19ZM420.08 36.36Q420.56 36.36 420.83 35.93Q421.1 35.49 421.1 34.95V24.69Q421.1 23.95 420.95 23.41Q420.79 22.86 420.08 22.86Q419.37 22.86 419.21 23.41Q419.05 23.95 419.05 24.69V34.95Q419.05 35.49 419.33 35.93Q419.61 36.36 420.08 36.36ZM431.77 40.24Q429.02 40.24 427.76 38.78Q426.51 37.33 426.