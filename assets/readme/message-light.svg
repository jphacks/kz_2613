<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 217" width="838" height="217" role="img"><title>操作を分担する不自由さが、そのまま新しい面白さになる。ゲーム自体は変えずに、操作する人と協力の仕方を変える。手元のゲームを、友達と集まったその場で新しい協力ゲームにします。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#FFF5DC"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 18)"><path d="M2.33 5.8V-6.69L6.74 -17.29H15.87L13.01 -7.08H18.5V5.8ZM22.61 5.8V-6.69L27.02 -17.29H36.14L33.29 -7.08H38.78V5.8Z" fill="url(#brand)"><title>“</title></path><rect x="66" y="98" width="56" height="4" rx="2" fill="url(#brand)"/><text x="66" y="36" class="gh" font-size="28" font-weight="800" fill="#2E2B48" text-anchor="start">操作を分担する不自由さが、</text><text x="66" y="76" class="gh" font-size="28" font-weight="800" fill="#2E2B48" text-anchor="start">そのまま新しい面白さになる。</text><text x="66" y="132" class="gh" font-size="15" font-weight="600" fill="#625E72" text-anchor="start">ゲーム自体は変えずに、操作する人と協力の仕方を変える。手元のゲームを、友達と集まったその場で新しい</text><text x="66" y="157" class="gh" font-size="15" font-weight="600" fill="#625E72" text-anchor="start">協力ゲームにします。</text></g></svg>
