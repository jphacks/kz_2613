<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 321" width="838" height="321" role="img"><title>特長。1：1つのキャラクターを2〜4人で分担する。移動・視点・アクションなどを分け合い、各スマホには自分の担当操作だけが並びます。ボタンの位置や大きさは持ち方に合わせて変えられ、60秒ごとに担当が入れ替わる交代ルールも選べます。。2：選んだゲームがそのまま協力ゲームになる。PCに入っているゲームを選ぶだけで、その操作に合った分担とコントローラーをその場で用意します。特定のタイトルに限らず、手元のPCゲームで共同操作を楽しめます。。3：専用の機器もアプリも要らない。Android・iPhoneの標準ブラウザでQRコードを読み取れば参加できます。ホストのスマホがリモコンになるので、PCのキーボードとマウスに触らずに、ゲーム選びから開始まで進められます。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#231B35"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><rect x="0.75" y="0.75" width="267.1666666666667" height="305.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(0.0 0)"><g transform="translate(22 22)"><rect x="0" y="0" width="56" height="56" rx="14" fill="#CB00EA"/><path d="M28 28L28.0 10.0A18 18 0 0 1 43.6 37.0Z" fill="#24C2FA" stroke="#CB00EA" stroke-width="2"/><path d="M28 28L43.6 37.0A18 18 0 0 1 12.4 37.0Z" fill="#5EFF5D" stroke="#CB00EA" stroke-width="2"/><path d="M28 28L12.4 37.0A18 18 0 0 1 28.0 10.0Z" fill="#FFFFFF" stroke="#CB00EA" stroke-width="2"/></g><text x="246.66666666666669" y="52" class="disp" font-size="30" font-weight="400" fill="url(#brand)" text-anchor="end">01</text><text x="22" y="104" class="gh" font-size="17" font-weight="700" fill="#EEF1F7" text-anchor="start">1つのキャラクターを</text><text x="22" y="129" class="gh" font-size="17" font-weight="700" fill="#EEF1F7" text-anchor="start">2〜4人で分担する</text><text x="22" y="168" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">移動・視点・アクションなどを分け</text><text x="22" y="191" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">合い、各スマホには自分の担当操作</text><text x="22" y="214" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">だけが並びます。ボタンの位置や大</text><text x="22" y="237" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">きさは持ち方に合わせて変えられ、</text><text x="22" y="260" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">60秒ごとに担当が入れ替わる交代</text><text x="22" y="283" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">ルールも選べます。</text></g><rect x="285.4166666666667" y="0.75" width="267.1666666666667" height="305.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(284.7 0)"><g transform="translate(22 22)"><rect x="0" y="0" width="56" height="56" rx="14" fill="#5EFF5D"/><rect x="11" y="13" width="7" height="7" rx="2" fill="#103B10"/><rect x="22" y="14" width="24" height="5" rx="2.5" fill="#103B10"/><rect x="11" y="25" width="7" height="7" rx="2" fill="#103B10"/><rect x="22" y="26" width="19" height="5" rx="2.5" fill="#103B10"/><rect x="11" y="37" width="7" height="7" rx="2" fill="#103B10"/><rect x="22" y="38" width="14" height="5" rx="2.5" fill="#103B10"/></g><text x="246.66666666666669" y="52" class="disp" font-size="30" font-weight="400" fill="url(#brand)" text-anchor="end">02</text><text x="22" y="104" class="gh" font-size="17" font-weight="700" fill="#EEF1F7" text-anchor="start">選んだゲームが</text><text x="22" y="129" class="gh" font-size="17" font-weight="700" fill="#EEF1F7" text-anchor="start">そのまま協力ゲームになる</text><text x="22" y="168" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">PCに入っているゲームを選ぶだけ</text><text x="22" y="191" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">で、その操作に合った分担とコント</text><text x="22" y="214" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">ローラーをその場で用意します。</text><text x="22" y="237" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">特定のタイトルに限らず、手元の</text><text x="22" y="260" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">PCゲームで共同操作を楽しめます。</text></g><rect x="570.0833333333334" y="0.75" width="267.1666666666667" height="305.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(569.3 0)"><g transform="translate(22 22)"><rect x="0" y="0" width="56" height="56" rx="14" fill="#24C2FA"/><rect x="8" y="8" width="16" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="3"/><rect x="13" y="13" width="6" height="6" fill="#FFFFFF"/><rect x="32" y="8" width="16" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="3"/><rect x="37" y="13" width="6" height="6" fill="#FFFFFF"/><rect x="8" y="32" width="16" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="3"/><rect x="13" y="37" width="6" height="6" fill="#FFFFFF"/><rect x="34" y="34" width="6" height="6" fill="#FFFFFF"/><rect x="42" y="42" width="6" height="6" fill="#FFFFFF"/><rect x="34" y="44" width="6" height="6" fill="#FFFFFF"/><rect x="44" y="33" width="6" height="6" fill="#FFFFFF"/></g><text x="246.66666666666669" y="52" class="disp" font-size="30" font-weight="400" fill="url(#brand)" text-anchor="end">03</text><text x="22" y="104" class="gh" font-size="17" font-weight="700" fill="#EEF1F7" text-anchor="start">専用の機器も</text><text x="22" y="129" class="gh" font-size="17" font-weight="700" fill="#EEF1F7" text-anchor="start">アプリも要らない</text><text x="22" y="168" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">Android・iPhoneの標準ブラウザ</text><text x="22" y="191" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">でQRコードを読み取れば参加でき</text><text x="22" y="214" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">ます。ホストのスマホがリモコンに</text><text x="22" y="237" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">なるので、PCのキーボードとマウ</text><text x="22" y="260" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">スに触らずに、ゲーム選びから開始</text><text x="22" y="283" class="gh" font-size="14" font-weight="400" fill="#AEB4C2" text-anchor="start">まで進められます。</text></g></svg>
