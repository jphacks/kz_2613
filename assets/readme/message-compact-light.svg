<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 233" width="460" height="233" role="img"><title>操作を分担する不自由さが、そのまま新しい面白さになる。ゲーム自体は変えずに、操作する人と協力の仕方を変える。手元のゲームを、友達と集まったその場で新しい協力ゲームにします。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#FFF5DC"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><g transform="translate(0 18)"><path d="M2.08 5.18V-5.98L6.02 -15.43H14.17L11.62 -6.32H16.52V5.18ZM20.19 5.18V-5.98L24.12 -15.43H32.27L29.72 -6.32H34.62V5.18Z" fill="url(#brand)"><title>“</title></path><rect x="60" y="89" width="56" height="4" rx="2" fill="url(#brand)"/><text x="60" y="32" class="gh" font-size="24" font-weight="800" fill="#2E2B48" text-anchor="start">操作を分担する不自由さが、</text><text x="60" y="67" class="gh" font-size="24" font-weight="800" fill="#2E2B48" text-anchor="start">そのまま新しい面白さになる。</text><text x="60" y="123" class="gh" font-size="15" font-weight="600" fill="#625E72" text-anchor="start">ゲーム自体は変えずに、操作する人と協力の仕方を</text><text x="60" y="148" class="gh" font-size="15" font-weight="600" fill="#625E72" text-anchor="start">変える。手元のゲームを、友達と集まったその場で</text><text x="60" y="173" class="gh" font-size="15" font-weight="600" fill="#625E72" text-anchor="start">新しい協力ゲームにします。</text></g></svg>
