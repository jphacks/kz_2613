<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 224" width="838" height="224" role="img"><title>試遊アンケート（回答者26名）の結果。楽しかった・またこの遊び方をしてみたい：100%（26名全員）。1人で遊んだときと違うプレイ体験だった：95.2%（そのゲームの経験者21名中20名）。自分の担当操作を思い通りに動かせた：84.6%（22名）</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#231B35"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><rect x="0.75" y="0.75" width="267.1666666666667" height="208.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(0.0 0)"><text x="22" y="74" class="disp" font-size="58" font-weight="400" fill="url(#brand)" text-anchor="start">100</text><text x="108.52" y="74" class="disp" font-size="29.0" font-weight="400" fill="url(#brand)" text-anchor="start">%</text><text x="22" y="108" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">楽しかった・</text><text x="22" y="130" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">またこの遊び方をしてみたい</text><text x="22" y="156" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">26名全員</text><rect x="22" y="184" width="224.66666666666669" height="6" rx="3.0" fill="#343B4E"/><rect x="22" y="184" width="224.7" height="6" rx="3.0" fill="url(#brand)"/></g><rect x="285.4166666666667" y="0.75" width="267.1666666666667" height="208.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(284.7 0)"><text x="22" y="74" class="disp" font-size="58" font-weight="400" fill="url(#brand)" text-anchor="start">95.2</text><text x="121.28" y="74" class="disp" font-size="29.0" font-weight="400" fill="url(#brand)" text-anchor="start">%</text><text x="22" y="108" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">1人で遊んだときと</text><text x="22" y="130" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">違うプレイ体験だった</text><text x="22" y="156" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">そのゲームの経験者21名中20名</text><rect x="22" y="184" width="224.66666666666669" height="6" rx="3.0" fill="#343B4E"/><rect x="22" y="184" width="213.9" height="6" rx="3.0" fill="url(#brand)"/></g><rect x="570.0833333333334" y="0.75" width="267.1666666666667" height="208.5" rx="14" fill="none" stroke="#343B4E" stroke-width="1.5"/><g transform="translate(569.3 0)"><text x="22" y="74" class="disp" font-size="58" font-weight="400" fill="url(#brand)" text-anchor="start">84.6</text><text x="121.28" y="74" class="disp" font-size="29.0" font-weight="400" fill="url(#brand)" text-anchor="start">%</text><text x="22" y="108" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">自分の担当操作を</text><text x="22" y="130" class="gh" font-size="15" font-weight="700" fill="#EEF1F7" text-anchor="start">思い通りに動かせた</text><text x="22" y="156" class="gh" font-size="13" font-weight="600" fill="#AEB4C2" text-anchor="start">22名</text><rect x="22" y="184" width="224.66666666666669" height="6" rx="3.0" fill="#343B4E"/><rect x="22" y="184" width="190.1" height="6" rx="3.0" fill="url(#brand)"/></g></svg>
