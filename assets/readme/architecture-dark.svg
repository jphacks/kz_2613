<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 886" width="838" height="886" role="img"><title>システム構成。スマホ（ブラウザ、React・TypeScript）2〜4台が、Windows 11 PCのモバイルホットスポットのローカルWi-Fiで、PCのRustホストに直接つながる。インターネットとSTUN/TURNは使わない。Rustホスト recooplay-host.exe の受け口は、WebRTC DataChannel（UDP・順序なし・再送なし、libdatachannel）とWebSocket /ws（TCP・JSON、axum、ポート8080）の2経路で、どのスマホも両方でつながる。Rustホストの中には、hubスレッド（認可・状態・順序・全解放）、出力キュー（60ms・50ms・視点4ms）、ゲーム解析・分担AI（MiniLM＋Transformer）がある。その外に、PCアプリ（Tauri 2・WebView2）、PC上のデータ（ゲームの設定・操作定義・分担AIの重み）、SendInput（Win32 API）、既存のPCゲーム（前面のときだけ入力）がある。ボタン入力は、スマホ → 受け口 → hubスレッド → 出力キュー → SendInput → 既存のPCゲームの順に届き、図ではP1のこの道を1つの点がたどる。PCアプリはWebSocketでRustホストとつながる。ゲーム解析・分担AIはPC上のデータを読み、分担をhubへ渡す。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141827"/><stop offset="1" stop-color="#231B35"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
@media (prefers-reduced-motion:reduce){.pk{display:none}}</style></defs><g transform="translate(0 10)"><rect x="1" y="15" width="836" height="148" rx="18" fill="#202535"/><rect x="1" y="15" width="836" height="148" rx="18" fill="none" stroke="url(#brand)" stroke-width="2" stroke-dasharray="6 5"/><g transform="translate(137.3 50.0) scale(0.4133)"><g><path d="M12 4C38 12 62 12 88 4C97 1 103 8 101 18C95 55 95 95 101 132C103 142 97 149 88 146C62 138 38 138 12 146C3 149-3 142-1 132C5 95 5 55-1 18C-3 8 3 1 12 4Z" fill="#24C2FA" stroke="#0A0A0A" stroke-width="1.4"/><rect x="14" y="16" width="72" height="117" rx="11" fill="#05060A"/><g filter="url(#glow)" transform="translate(0 6)"><g><circle cx="37" cy="46" r="8.5" fill="#19F6FF"/><circle cx="63" cy="46" r="8.5" fill="#19F6FF"/></g><path d="M45 56l5 5 5-5" fill="none" stroke="#19F6FF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><rect x="142.0" y="120" width="34" height="22" rx="11" fill="#24C2FA"/><text x="159.0" y="135.5" class="gh" font-size="13" font-weight="700" fill="#06243A" text-anchor="middle">P1</text><g transform="translate(226.0 50.0) scale(0.4133)"><g><path d="M12 4C38 12 62 12 88 4C97 1 103 8 101 18C95 55 95 95 101 132C103 142 97 149 88 146C62 138 38 138 12 146C3 149-3 142-1 132C5 95 5 55-1 18C-3 8 3 1 12 4Z" fill="#5EFF5D" stroke="#0A0A0A" stroke-width="1.4"/><rect x="14" y="16" width="72" height="117" rx="11" fill="#05060A"/><g filter="url(#glow)" transform="translate(0 6)"><g><rect x="29" y="37" width="15" height="14" rx="2.5" fill="#86FF55"/><rect x="56" y="37" width="15" height="14" rx="2.5" fill="#86FF55"/></g><rect x="44" y="56" width="12" height="5" rx="2.5" fill="#86FF55"/></g></g></g><rect x="230.66666666666669" y="120" width="34" height="22" rx="11" fill="#5EFF5D"/><text x="247.66666666666669" y="135.5" class="gh" font-size="13" font-weight="700" fill="#0C3A0C" text-anchor="middle">P2</text><g transform="translate(314.7 50.0) scale(0.4133)"><g><path d="M12 4C38 12 