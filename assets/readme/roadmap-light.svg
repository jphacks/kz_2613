<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 220" width="838" height="220" role="img"><title>今後の展望。まず：誰もが手元のPCで遊べるサービスとして公開する。初めての人でも迷わず導入・参加できるように仕上げます。。その先：遊べるゲームと場所を広げる。対応するゲームと設定形式を増やし、PCゲーム以外のプラットフォームや、離れた場所の友達と同じキャラクターを操作するオンライン対応へ広げます。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C03BFF"/><stop offset=".55" stop-color="#6F86FF"/><stop offset="1" stop-color="#22C4FA"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#FFF5DC"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:RcRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:RcHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.eyes,.flow,.pulse{animation:none}}
</style></defs><rect x="0.75" y="0.75" width="393.5" height="204.5" rx="14" fill="none" stroke="#D8DEE8" stroke-width="1.5"/><g transform="translate(0.0 0)"><rect x="22" y="22" width="44" height="44" rx="12" fill="#24C2FA"/><path d="M44 30c6 4 8 11 6 19h-12c-2-8 0-15 6-19z" fill="#FFFFFF"/><circle cx="44" cy="41" r="2.6" fill="#24C2FA"/><path d="M38 45l-5 6h5M50 45l5 6h-5M41 52l3 6 3-6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/><text x="80" y="37" class="gh" font-size="13" font-weight="700" fill="#625E72" text-anchor="start" letter-spacing="3">NOW</text><text x="80" y="61" class="gh" font-size="20" font-weight="700" fill="#2E2B48" text-anchor="start">まず</text><text x="22" y="100" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="start">誰もが手元のPCで遊べる</text><text x="22" y="124" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="start">サービスとして公開する</text><text x="22" y="158" class="gh" font-size="14" font-weight="400" fill="#625E72" text-anchor="start">初めての人でも迷わず導入・参加できるように仕上げま</text><text x="22" y="180" class="gh" font-size="14" font-weight="400" fill="#625E72" text-anchor="start">す。</text></g><rect x="443.75" y="0.75" width="393.5" height="204.5" rx="14" fill="none" stroke="#D8DEE8" stroke-width="1.5"/><g transform="translate(443.0 0)"><rect x="22" y="22" width="44" height="44" rx="12" fill="#CB00EA"/><circle cx="44" cy="44" r="12.5" fill="none" stroke="#FFFFFF" stroke-width="2.6"/><ellipse cx="44" cy="44" rx="5.5" ry="12.5" fill="none" stroke="#FFFFFF" stroke-width="2.2"/><path d="M31.5 44h25M33.5 37.5h21M33.5 50.5h21" stroke="#FFFFFF" stroke-width="2"/><text x="80" y="37" class="gh" font-size="13" font-weight="700" fill="#625E72" text-anchor="start" letter-spacing="3">NEXT</text><text x="80" y="61" class="gh" font-size="20" font-weight="700" fill="#2E2B48" text-anchor="start">その先</text><text x="22" y="100" class="gh" font-size="16" font-weight="700" fill="#2E2B48" text-anchor="start">遊べるゲームと場所を広げる</text><text x="22" y="134" class="gh" font-size="14" font-weight="400" fill="#625E72" text-anchor="start">対応するゲームと設定形式を増やし、PCゲーム以外の</text><text x="22" y="156" class="gh" font-size="14" font-weight="400" fill="#625E72" text-anchor="start">プラットフォームや、離れた場所の友達と同じキャラク</text><text x="22" y="178" class="gh" font-size="14" font-weight="400" fill="#625E72" text-anchor="start">ターを操作するオンライン対応へ広げます。</text></g><g transform="translate(419.0 103.0) rotate(0)"><circle r="15" fill="none" stroke="#D8DEE8" stroke-width="1.5"/><path d="M-5 0h10M1 -5l5 5-5 5" fill="none" stroke="url(#brand)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
