<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re:Cooplay</title>
<style>
  :root { --bg:#0f1216; --panel:#1a1f26; --line:#2b323c; --text:#e8ecf1; --muted:#8b95a3; --ng:#f85149; --accent:#4c8dff; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; display:flex; align-items:center; justify-content:center; }
  .box { text-align:center; max-width:560px; padding:24px; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.6; }
  #err { display:none; color:var(--ng); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; text-align:left; white-space:pre-wrap; }
  .spin { width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; margin:16px auto; animation:r 0.9s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <h1>Re:Cooplay</h1>
  <p id="msg">PCホストを起動しています…</p>
  <div class="spin" id="spin"></div>
  <div id="err"></div>
</div>
<script>
  // アプリ本体 (src/main.rs) がホストを起動できなかったときに呼ぶ
  window.showError = (text) => {
    document.getElementById('msg').textContent = 'PCホストを起動できませんでした';
    document.getElementById('spin').style.display = 'none';
    const el = document.getElementById('err');
    el.textContent = text;
    el.style.display = 'block';
  };
</script>
</body>
</html>
