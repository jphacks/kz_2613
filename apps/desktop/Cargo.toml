[package]
name = "recooplay-desktop"
version = "0.1.0"
edition = "2021"
description = "Re:Cooplay PC app: Tauri (WebView2) window that starts the Rust host and shows the PC screens"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
