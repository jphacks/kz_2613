<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re:Cooplay</title>
<style>
  :root { --bg:#0f1216; --panel:#1a1f26; --panel2:#222934; --line:#2b323c; --text:#e8ecf1; --muted:#8b95a3; --ok:#3fb950; --ng:#f85149; --warn:#d29922; --accent:#4c8dff; --p1:#4c8dff; --p2:#3fb950; --p3:#d29922; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:16px; padding:16px 28px; border-bottom:1px solid var(--line); }
  header h1 { font-size:22px; margin:0; letter-spacing:0.02em; }
  .pill { font-size:13px; padding:4px 12px; border-radius:999px; background:var(--panel); border:1px solid var(--line); color:var(--muted); }
  .pill.ok { color:var(--ok); } .pill.ng { color:var(--ng); } .pill.warn { color:var(--warn); }
  .grow { flex:1; }
  nav.steps { display:flex; gap:8px; padding:16px 28px 0; }
  nav.steps button { flex:1; text-align:left; background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:12px; padding:12px 16px; font-size:15px; cursor:pointer; }
  nav.steps button.sel { color:var(--text); border-color:var(--accent); background:var(--panel2); }
  main { flex:1; padding:20px 28px; overflow:auto; }
  .screen { display:none; } .screen.show { display:block; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .muted { color:var(--muted); }
  h2 { font-size:20px; margin:0 0 12px; }
  h3 { font-size:16px; margin:0 0 8px; }

  /* ① 参加 */
  .join { display:grid; grid-template-columns:minmax(280px, 380px) 1fr; gap:20px; }
  .qr { background:#fff; border-radius:12px; padding:12px; aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  .qr svg { width:100%; height:100%; }
  .url { font-family:ui-monospace, monospace; font-size:18px; margin-top:12px; word-break:break-all; }
  .slots { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:12px; }
  .slot { border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--panel2); }
  .slot .name { font-size:28px; font-weight:700; }
  .slot[data-slot=P1] .name { color:var(--p1); } .slot[data-slot=P2] .name { color:var(--p2); } .slot[data-slot=P3] .name { color:var(--p3); }
  .slot .state { font-size:13px; margin-top:6px; }
  .slot.connected { border-color:var(--ok); } .slot.lost { border-color:var(--warn); }
  .slot.connected .state { color:var(--ok); } .slot.lost .state { color:var(--warn); } .slot.empty .state { color:var(--muted); }
  .count { font-size:44px; font-weight:700; }

  /* ② ゲーム選択 */
  .game { display:flex; gap:20px; align-items:flex-start; border:2px solid var(--line); border-radius:14px; padding:20px; cursor:pointer; background:var(--panel); }
  .game.sel { border-color:var(--accent); }
  .game .badge { display:inline-block; font-size:12px; color:var(--warn); border:1px solid var(--warn); border-radius:999px; padding:2px 10px; margin-left:8px; }
  .game ol { margin:8px 0 0; padding-left:20px; line-height:1.8; }

  /* ③ 分担 */
  .roles { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
  .role ul { margin:8px 0 0; padding-left:18px; line-height:1.7; }
  .role .host { font-size:12px; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:1px 8px; margin-left:6px; }
  .start { margin-top:16px; display:flex; gap:20px; align-items:flex-start; }
  .start .card { flex:1; }
  .ok { color:var(--ok); } .ng { color:var(--ng); } .warn { color:var(--warn); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { background:var(--bg); color:var(--muted); border:0; padding:8px 14px; font-size:14px; cursor:pointer; }
  .seg button.sel { background:var(--accent); color:#fff; }

  .actions { display:flex; gap:12px; margin-top:20px; }
  .actions button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 20px; font-size:15px; cursor:pointer; }
  .actions button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* 協力プレイ中・一時停止中の案内 */
  #phaseBanner { display:none; margin:16px 28px 0; padding:14px 18px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); }
  #phaseBanner.coop { display:block; border-color:var(--ok); }
  #phaseBanner.paused { display:block; border-color:var(--warn); }
  #phaseBanner b { font-size:17px; margin-right:10px; }

  footer { display:flex; gap:16px; align-items:center; padding:10px 28px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  footer a { color:var(--muted); }
  @media (max-width: 900px) { .join, .start { grid-template-columns:1fr; display:block; } .roles, .slots { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Re:Cooplay</h1>
  <span class="pill" id="phase">接続中…</span>
  <span class="grow"></span>
  <span class="pill" id="conn">ホストに接続中…</span>
</header>
<div id="phaseBanner"><b id="phaseTitle"></b><span id="phaseDetail"></span></div>
<nav class="steps" id="steps"></nav>

<main>
  <!-- ① 参加: QR・URL・人数 -->
  <section class="screen" id="s-join">
    <div class="join">
      <div class="card">
        <h3>スマホで読み取って参加</h3>
        <div class="qr" id="qr"><span class="muted">読み込み中…</span></div>
        <div class="url" id="url"></div>
        <div class="muted" id="urlNote" style="font-size:13px; margin-top:6px"></div>
        <div id="wifi" style="margin-top:16px"></div>
      </div>
      <div class="card">
        <div style="display:flex; align-items:baseline; gap:12px">
          <span class="count" id="count">0/3</span><span class="muted">人が参加中</span>
        </div>
        <p class="muted" style="margin:8px 0 0">最初に参加したスマホが <b style="color:var(--p1)">ホスト（P1）</b> になり、START・PAUSE と、この画面の操作（矢印・Enter・Esc）を担当します。通信が切れても、同じスマホは元の枠に戻ります。</p>
        <div class="slots" id="slots"></div>
      </div>
    </div>
    <div class="actions"><button class="primary" data-go="game">次へ：ゲームを選ぶ →</button></div>
  </section>

  <!-- ② ゲーム選択: 手動起動前提 -->
  <section class="screen" id="s-game">
    <h2>遊ぶゲーム</h2>
    <div id="games"></div>
    <p class="muted" style="font-size:13px">ゲームの自動検出・自動起動はまだありません。ゲームは手動で起動してください。</p>
    <div class="actions"><button data-go="join">← 参加に戻る</button><button class="primary" data-go="roles">次へ：分担を確認 →</button></div>
  </section>

  <!-- ③ 分担確認 -->
  <section class="screen" id="s-roles">
    <h2>操作の分担（Minecraft）</h2>
    <div class="roles" id="roles"></div>
    <div class="start">
      <div class="card">
        <h3>開始の条件</h3>
        <div id="startState"></div>
      </div>
      <div class="card">
        <h3>ゲームへの入力</h3>
        <div class="seg" id="modeSeg"><button data-mode="off">OFF</button><button data-mode="on">常時ON（Minecraftが前面のときだけ）</button></div>
        <div class="muted" id="modeNote" style="font-size:13px; margin-top:10px"></div>
      </div>
    </div>
    <div class="actions"><button data-go="game">← ゲーム選択に戻る</button></div>
  </section>
</main>

<footer>
  <span id="target"></span>
  <span class="grow"></span>
  <span id="hotkey"></span>
  <a href="/host" target="_self">診断画面</a>
</footer>

<script type="module">
  import { SCREENS, SCREEN_TITLES, ROLES, GAMES, slotViews, startView, phaseView, navigate, joinUrl } from './app-view.js';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  // 表示中の画面は PC 画面だけの状態。選んだゲーム・セッション・役割はホストが保持する
  let ui = { screen: 'join', game: GAMES[0].id };
  try { ui.screen = JSON.parse(localStorage.getItem('recooplay.app') || '{}').screen || ui.screen; } catch {}
  if (!SCREENS.includes(ui.screen)) ui.screen = 'join';
  let state = null, game = null, inject = null;

  function setUi(next) {
    // ゲームの変更はホストへ送る (協力プレイ中ならホストが全解放して準備中へ戻す)。表示はホストの返事で変わる
    if (next.game !== ui.game && ws?.readyState === 1) ws.send(JSON.stringify({ type: 'select_game', title: next.game }));
    ui = { ...next, game: game?.title || next.game };
    try { localStorage.setItem('recooplay.app', JSON.stringify({ screen: ui.screen })); } catch {}
    render();
  }

  // この画面が前面になったことをホストへ知らせる。協力プレイ中に Minecraft から手動で戻ると、
  // ホストは全キーを離して一時停止し、ホストのスマホをリモコンに戻す
  function sendFocus() { if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'focus', focused: document.hasFocus() })); }
  window.addEventListener('focus', sendFocus);
  window.addEventListener('blur', sendFocus);

  $('steps').innerHTML = SCREENS.map((s) => `<button data-go="${s}">${SCREEN_TITLES[s]}</button>`).join('');
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]')?.dataset.go;
    if (go) setUi({ ...ui, screen: go });
    const g = e.target.closest('[data-game]')?.dataset.game;
    if (g) setUi({ ...ui, game: g });
    const mode = e.target.closest('[data-mode]')?.dataset.mode;
    if (mode && ws?.readyState === 1) ws.send(JSON.stringify({ type: 'inject_mode', mode }));
  });
  // PC のキーボードでも同じ操作
  document.addEventListener('keydown', (e) => {
    const c = { ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', ArrowUp: 'UP', ArrowDown: 'DOWN', Enter: 'ENTER', Escape: 'ESC' }[e.key];
    if (c && !e.target.closest('button')) setUi(navigate(ui, c));
  });

  function render() {
    for (const s of SCREENS) $('s-' + s).classList.toggle('show', s === ui.screen);
    document.querySelectorAll('#steps button').forEach((b) => b.classList.toggle('sel', b.dataset.go === ui.screen));

    const pv = phaseView(game, inject);
    $('phase').textContent = pv.title;
    $('phase').className = 'pill ' + (pv.phase === 'coop' ? 'ok' : pv.phase === 'paused' ? 'warn' : '');
    $('phaseBanner').className = pv.phase === 'coop' || pv.phase === 'paused' ? pv.phase : '';
    $('phaseTitle').textContent = pv.title;
    $('phaseDetail').textContent = pv.detail;

    // ① 参加
    const slots = slotViews(state?.slots);
    $('count').textContent = `${slots.filter((s) => s.state === 'connected').length}/${game?.required ?? 3}`;
    $('slots').innerHTML = slots.map((s) => `
      <div class="slot ${s.state}" data-slot="${s.slot}">
        <div class="name">${s.slot}</div>
        <div>${esc(s.title)}</div>
        <div class="state">${esc(s.label)}${s.device ? ' · ' + esc(s.device) : ''}</div>
      </div>`).join('');

    // ② ゲーム
    $('games').innerHTML = GAMES.map((g) => `
      <div class="game ${g.id === ui.game ? 'sel' : ''}" data-game="${g.id}">
        <div>
          <h3>${esc(g.name)}<span class="badge">${esc(g.status)}</span></h3>
          <div class="muted">準備の手順</div>
          <ol>${g.steps.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>
        </div>
      </div>`).join('');

    // ③ 分担
    $('roles').innerHTML = ROLES.map((r) => {
      const s = slots.find((x) => x.slot === r.slot);
      return `<div class="card role slot ${s.state}" data-slot="${r.slot}">
        <div class="name">${r.slot}<span style="font-size:16px; font-weight:400; margin-left:8px">${esc(r.title)}</span>${r.host ? '<span class="host">ホスト管理</span>' : ''}</div>
        <div class="state">${esc(s.label)}</div>
        <ul>${r.controls.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>
      </div>`;
    }).join('');
    const sv = startView(game, inject);
    $('startState').innerHTML = (sv.canStart
      ? '<div class="ok" style="font-size:17px">✓ 開始できます。ホストのスマホで START を押してください</div>'
      : `<div class="ng" style="font-size:17px">まだ開始できません</div><ul>${sv.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`)
      + sv.notes.map((n) => `<div class="warn" style="margin-top:8px">⚠ ${esc(n)}</div>`).join('');
    document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('sel', b.dataset.mode === inject?.mode));
    $('modeNote').textContent = inject?.mode === 'test' ? '診断画面で「テスト」モードになっています' : 'Minecraft 以外のウィンドウが前面のときは、操作を送らずにすべてのキーを離します';

    // フッター: 入力先・緊急停止
    const t = inject?.target;
    $('target').textContent = !inject ? '' : inject.mode === 'test' ? '○ 診断用のテストモード（疑似ゲーム画面）' : inject.active ? '● Minecraft に入力中' : inject.mode === 'off' ? '○ ゲームへの入力: OFF' : `○ 入力停止中（前面: ${t?.process || '不明'}）`;
    $('target').className = inject?.active ? 'ok' : '';
    $('hotkey').textContent = inject?.emergencyHotkey ? (inject.emergencyHotkeyError ? `⚠ 緊急停止キーを登録できません` : `緊急停止：${inject.emergencyHotkey}`) : '';
  }

  async function loadInfo() {
    try {
      const info = await (await fetch('/api/info')).json();
      const u = joinUrl(info);
      $('qr').innerHTML = u ? u.qr : '<span class="muted">ネットワークが見つかりません</span>';
      $('url').textContent = u ? u.url : '';
      $('urlNote').textContent = !u ? '' : u.hotspot ? 'PC のモバイルホットスポットに接続してから読み取ってください' : '※ ホットスポット（192.168.137.x）ではありません。ホットスポットを ON にすると自動で切り替わります';
      $('wifi').innerHTML = info.wifi ? `<div class="muted" style="font-size:13px">Wi-Fi：<b style="color:var(--text)">${esc(info.wifi.ssid)}</b></div>` : '';
    } catch {}
  }

  // ホストとの接続 (PC 画面 = モニター)。ホストのスマホのリモコンは "remote" で届く
  let ws = null;
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { $('conn').textContent = 'ホスト接続OK'; $('conn').className = 'pill ok'; ws.send(JSON.stringify({ type: 'monitor', page: 'app' })); sendFocus(); };
    ws.onclose = () => { $('conn').textContent = 'ホストとの接続が切れました'; $('conn').className = 'pill ng'; setTimeout(connect, 1000); };
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'state') { state = m; game = m.game; inject = m.inject; }
      else if (m.type === 'game') game = m.game;
      if (m.type === 'state' || m.type === 'game') { if (game?.title) ui.game = game.title; render(); }
      // この画面が前面のときだけ反応する (Minecraft が前面ならキー入力として Minecraft へ届いている)
      else if (m.type === 'remote' && m.state === 'down' && document.hasFocus()) setUi(navigate(ui, m.control));
    };
  }

  render();
  loadInfo();
  setInterval(loadInfo, 5000); // ホットスポットを後から ON にした場合に備えて取り直す
  connect();
</script>
</body>
</html>
