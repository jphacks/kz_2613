[package]
name = "recooplay-host"
version = "0.1.0"
edition = "2021"
description = "Re:Cooplay PC host (Rust port of the Node prototype): HTTP + WebSocket + WebRTC, Windows SendInput"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# WebRTC: Node 版と同じ libdatachannel (iPhone Safari / Android Chrome で接続確認済み)。OpenSSL ごと静的リンク
datachannel = { version = "0.16", features = ["vendored"] }
log = "0.4"
# 再接続用トークンの乱数 (OS の暗号論的乱数)。既存の依存ツリーにあるものと同じ版
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
