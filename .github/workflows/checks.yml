name: Structure checks
# リポジトリ構成の確認。Rust版ホスト・PCアプリ・シミュレーションは rust.yml で実行する。
# 旧Python（FastAPI）・Reactのひな形の検証は #68 で削除した。
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_overlay.py
