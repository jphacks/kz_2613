name: Structure checks
# リポジトリの主要な部分がそろっているかの確認 (Rust なしで速く失敗を知らせる、#117)。ビルド・試験は rust.yml で実行する。
# 旧Python（FastAPI）・Reactのひな形の検証は #68 で削除した。
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_overlay.py
      - run: python scripts/check-public-docs.py
      # READMEの図の <picture> が、GitHub の外観の固定や画面幅で正しい版を選べる形か（scripts/readme/markup.py）
      - run: python scripts/readme/markup.py check
      # READMEの図の文字が、実測した各画面幅の本文欄で12.5px以上か
      - run: python scripts/readme/check_text_size.py
      - run: python scripts/sync-protocol-version.py --check
