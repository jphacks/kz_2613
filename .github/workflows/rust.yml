name: Rust host and protocol simulation
# Rust 版ホスト・PC アプリのビルドと、通信契約のシミュレーション (注入なし)。
# OS 入力は送らない (RECOOPLAY_DRY_RUN=1)。ゲームや実機の合格の代わりにはならない。
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
  RECOOPLAY_DRY_RUN: '1'
jobs:
  host-rs:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # bindgen (datachannel-sys) と OpenSSL のビルドに使う。Git 付属の Perl では OpenSSL をビルドできない
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Strawberry Perl を優先する
        timeout-minutes: 5
        shell: pwsh
        run: echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # 試験スクリプト (scripts/sim/*.mjs) は依存なしの Node で動く。製品には含まれない
      - uses: actions/cache@v4
        timeout-minutes: 8
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/host-rs/target
          key: host-rs-${{ runner.os }}-${{ hashFiles('apps/host-rs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: host-rs-${{ runner.os }}-
      - name: Rustの版をそろえる（rust-toolchain.toml）
        timeout-minutes: 10
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
      - run: cargo build --release --locked
        timeout-minutes: 25
        working-directory: apps/host-rs
      # 分担のモデルの版2 (#430) と照合の正解を取得し、Python との一致試験を走らせる。重みは Git の対象外
      - uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: data/local/preset-model/export-v2
          key: preset-model-v2-${{ hashFiles('scripts/windows/preset-model-v2.json') }}
      - name: 分担のモデル（版2）を取得する
        timeout-minutes: 10
        shell: powershell
        run: ./scripts/windows/fetch-preset-model.ps1 -Dest data/local/preset-model/export-v2 -IncludeTests
      - run: cargo test --release --locked
        timeout-minutes: 25
        working-directory: apps/host-rs
      - name: Rustの整形とClippyを確認する
        timeout-minutes: 25
        shell: pwsh
        run: |
          rustup component add rustfmt clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $PSNativeCommandUseErrorActionPreference = $false
          cargo fmt --manifest-path apps/host-rs/Cargo.toml -- --check
          $fmt = $LASTEXITCODE
          cargo clippy --manifest-path apps/host-rs/Cargo.toml --locked --release --all-targets -- -D warnings
          if ($fmt -or $LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: windows-host-build
          path: |
            apps/host-rs/target/release/recooplay-host.exe
            apps/host-rs/target/release/recooplay-input-probe.exe
          if-no-files-found: error
      # 遅延の計測用ビルド (feature latency-measure) が壊れていないかを確かめる。配布物には入れないので、アップロードの後に行う
      - name: 遅延の計測用ビルドの整形・Clippy・試験（配布物には入れない）
        timeout-minutes: 25
        shell: pwsh
        run: |
          cargo clippy --manifest-path apps/host-rs/Cargo.toml --locked --release --all-targets --features latency-measure -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path apps/host-rs/Cargo.toml --release --locked --features latency-measure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  web:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
      - name: React版の画面をビルド
        timeout-minutes: 5
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: コントローラー共通描画モデル
        timeout-minutes: 5
        run: node --experimental-strip-types scripts/sim/controller-layout-test.mjs
      - name: 共通React部品のプレビューと入力境界
        timeout-minutes: 5
        run: node --experimental-strip-types scripts/sim/controller-preview-test.mjs
      - name: 製品TypeScriptの入力・通信・表示・破棄と依存グラフ
        timeout-minutes: 5
        run: node scripts/sim/product-web-test.mjs
      - name: Android試験の経路判定とUSBへの誤退避の拒否
        timeout-minutes: 5
        run: |
          node scripts/device/android-dry-run-test.mjs
          node scripts/device/wifi-route-test.mjs
          node scripts/device/fault-timeline-test.mjs
          node scripts/device/rtc-fault-observer-test.mjs
          node scripts/device/wifi-host-analysis-test.mjs
          node scripts/device/wifi-trial-acks-test.mjs
          node scripts/device/wifi-comparison-plan-test.mjs
          node scripts/device/summarize-wifi-overhead-test.mjs
          node scripts/device/wifi-ack-observer-test.mjs
          node scripts/device/look-gap-analysis-test.mjs
      - name: スマホのレイアウトモデル（標準生成・検証・合成・担当表示・縦横変換・保存）
        timeout-minutes: 5
        run: node scripts/sim/phone-layout-test.mjs
      - name: 改良後UIの撮影証拠の寸法と画面網羅
        timeout-minutes: 5
        run: node scripts/sim/verify-ui-evidence.mjs
      - name: 操作定義の静的抽出
        timeout-minutes: 5
        run: node scripts/sim/profile-extract-test.mjs
      - name: エンジンごとの操作の読み取り（ツクール・ウディタ・Source・Bethesda・Godot・Unreal・CryEngine・Unity）
        timeout-minutes: 5
        run: node scripts/sim/profile-engines-test.mjs
      - name: カタログと操作定義の照合
        timeout-minutes: 5
        run: node scripts/sim/profile-catalog-test.mjs
      - name: 静的画面の構文
        timeout-minutes: 5
        run: node scripts/sim/check-static-pages.mjs
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: windows-web-build
          path: apps/web/dist/
          if-no-files-found: error

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/cache@v4
        timeout-minutes: 8
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: desktop-${{ runner.os }}-
      - name: Rustの版をそろえる（rust-toolchain.toml）
        timeout-minutes: 10
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
      - run: cargo build --release --locked
        timeout-minutes: 25
        working-directory: apps/desktop
      - name: PCアプリの起動失敗時の案内
        timeout-minutes: 25
        run: cargo test --release --locked --manifest-path apps/desktop/Cargo.toml
      - name: Rustの整形とClippyを確認する
        timeout-minutes: 25
        shell: pwsh
        run: |
          rustup component add rustfmt clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $PSNativeCommandUseErrorActionPreference = $false
          cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check
          $fmt = $LASTEXITCODE
          cargo clippy --manifest-path apps/desktop/Cargo.toml --locked --release --all-targets -- -D warnings
          if ($fmt -or $LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: windows-desktop-build
          path: apps/desktop/target/release/recooplay-desktop.exe
          if-no-files-found: error

  protocol:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [host-rs, web]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: windows-host-build
          path: apps/host-rs/target/release
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: windows-web-build
          path: apps/web/dist
      - name: 通信契約のシミュレーション（Rust 版）
        id: protocol-sim
        timeout-minutes: 8
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP protocol-sim.txt
          $env:RECOOPLAY_PROTOCOL_DIAGNOSTICS = Join-Path $env:RUNNER_TEMP protocol-sessions
          node scripts/sim/protocol-sim.mjs *> $log
          $status = $LASTEXITCODE
          Get-Content -LiteralPath $log
          exit $status
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: failure() && steps.protocol-sim.outcome == 'failure'
        with:
          name: protocol-sim-diagnostics
          path: |
            ${{ runner.temp }}/protocol-sim.txt
            ${{ runner.temp }}/protocol-sessions/*/session-*.jsonl
      - name: 終了通知と親プロセス消失時の全解放
        timeout-minutes: 5
        run: node scripts/sim/shutdown-sim.mjs
      - name: 実WebSocketの非注入計測スモーク
        timeout-minutes: 5
        run: node scripts/sim/runtime-measure.mjs --bin apps/host-rs/target/release/recooplay-host.exe --players 2 --cases normal --duration-ms 1000
      - name: 画像と外部化したCSS・JSの配信
        timeout-minutes: 5
        run: node scripts/sim/static-assets-sim.mjs
      - name: 観客表示と診断画面の起動・受信境界・破棄
        timeout-minutes: 5
        id: auxiliary-pages
        env:
          RECOOPLAY_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/recooplay-smoke-diagnostics
        run: node scripts/sim/auxiliary-pages-smoke.mjs --pages overlay,diagnostics,pseudo-game
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: failure() && steps.auxiliary-pages.outcome == 'failure'
        with:
          name: auxiliary-pages-diagnostics
          path: ${{ runner.temp }}/recooplay-smoke-diagnostics
      - name: 入力プローブの安全経路（--mock、OS 入力なし）
        timeout-minutes: 5
        run: node scripts/sim/input-probe-sim.mjs
      - name: PCとスマホの寸法別の画面を検査する
        id: viewport-layout
        timeout-minutes: 6
        shell: pwsh
        env:
          RECOOPLAY_RUNTIME_MEASURE: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $hostExe = 'apps/host-rs/target/release/recooplay-host.exe'
          $failed = $false
          node scripts/sim/capture-screens.mjs --bin $hostExe --pc-size 800x560 --phone-size 384x701 --assert-layout --out data/local/ci-layout/compact
          if ($LASTEXITCODE) { $failed = $true }
          node scripts/sim/capture-screens.mjs --bin $hostExe --pc-size 900x1000 --phone-size 402x874 --assert-layout --out data/local/ci-layout/tall
          if ($LASTEXITCODE -or $failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: ${{ !cancelled() && (steps.viewport-layout.outcome == 'success' || steps.viewport-layout.outcome == 'failure') }}
        with:
          name: viewport-layout
          path: data/local/ci-layout

  package:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [protocol, desktop]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: windows-host-build
          path: apps/host-rs/target/release
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: windows-web-build
          path: apps/web/dist
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: windows-desktop-build
          path: apps/desktop/target/release
      - name: Windows配布zipを作成
        timeout-minutes: 5
        shell: powershell
        run: ./scripts/windows/package.ps1
      - name: 配布zipの同梱物・展開後の起動を確認（OS入力なし）
        timeout-minutes: 5
        run: node scripts/sim/package-smoke.mjs
      - name: 配布PCアプリのWebView2で参加画面・設定・終了を確認（OS入力なし）
        timeout-minutes: 5
        shell: pwsh
        run: |
          $package = @(Get-ChildItem -LiteralPath dist -Directory -Filter 'ReCooplay-*-windows-x64')
          if ($package.Count -ne 1) { throw '配布フォルダーを一意に特定できません' }
          $env:RECOOPLAY_SMOKE_DIAGNOSTICS = Join-Path $env:RUNNER_TEMP 'webview2-diagnostics'
          New-Item -ItemType Directory -Force $env:RECOOPLAY_SMOKE_DIAGNOSTICS | Out-Null
          $log = Join-Path $env:RECOOPLAY_SMOKE_DIAGNOSTICS 'webview2-smoke.log'
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/sim/desktop-webview2-smoke.mjs $package[0].FullName 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: failure()
        timeout-minutes: 3
        with:
          name: windows-webview2-diagnostics
          path: ${{ runner.temp }}/webview2-diagnostics/
          if-no-files-found: ignore
      - name: Windowsインストーラーを作成（NSIS、zipと同じ同梱物）
        timeout-minutes: 5
        shell: powershell
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          ./scripts/windows/build-installer.ps1
      - name: インストーラーの事前チェック・サイレント導入・更新・アンインストール（取得・PC設定変更なし）
        timeout-minutes: 5
        run: node scripts/sim/installer-smoke.mjs
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: ReCooplay-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: '24'
      - name: Webのロックファイルを監査する
        timeout-minutes: 3
        working-directory: apps/web
        run: npm audit --package-lock-only
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_AUDIT_VERSION: '0.22.1'
    strategy:
      fail-fast: false
      matrix:
        crate: [host-rs, desktop]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Rustの版をそろえる（rust-toolchain.toml）
        timeout-minutes: 10
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
      - name: RustSecの監査ツールを復元する
        id: audit-tool-cache
        uses: actions/cache@v4
        timeout-minutes: 2
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: RustSecの監査ツールを用意する
        if: steps.audit-tool-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: cargo install --locked --version "=$CARGO_AUDIT_VERSION" cargo-audit
      - name: 使用したツールの版を表示する
        timeout-minutes: 1
        run: cargo audit --version
      - name: Rustのロックファイルを監査する
        timeout-minutes: 5
        working-directory: apps/${{ matrix.crate }}
        run: cargo audit
