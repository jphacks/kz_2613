name: Rust host and protocol simulation
# Rust 版ホスト・PC アプリのビルドと、通信契約のシミュレーション (注入なし)。
# OS 入力は送らない (RECOOPLAY_DRY_RUN=1)。ゲームや実機の合格の代わりにはならない。
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
  RECOOPLAY_DRY_RUN: '1'
jobs:
  host-rs:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # bindgen (datachannel-sys) と OpenSSL のビルドに使う。Git 付属の Perl では OpenSSL をビルドできない
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - name: Strawberry Perl を優先する
        shell: pwsh
        run: echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # 試験スクリプト (scripts/sim/*.mjs) は依存なしの Node で動く。製品には含まれない
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/host-rs/target
          key: host-rs-${{ runner.os }}-${{ hashFiles('apps/host-rs/Cargo.lock') }}
          restore-keys: host-rs-${{ runner.os }}-
      - name: React版の画面をビルド
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - run: cargo build --release --locked
        working-directory: apps/host-rs
      - run: cargo test --release --locked
        working-directory: apps/host-rs
      - name: 通信契約のシミュレーション（Rust 版）
        run: node scripts/sim/protocol-sim.mjs
      - name: 終了通知と親プロセス消失時の全解放
        run: node scripts/sim/shutdown-sim.mjs
      - name: 実WebSocketの非注入計測スモーク
        run: node scripts/sim/runtime-measure.mjs --bin apps/host-rs/target/release/recooplay-host.exe --players 2 --cases normal --duration-ms 1000
      - name: コントローラー共通描画モデル
        run: node --experimental-strip-types scripts/sim/controller-layout-test.mjs
      - name: 共通React部品のプレビューと入力境界
        run: node --experimental-strip-types scripts/sim/controller-preview-test.mjs
      - name: 製品TypeScriptの入力・通信・表示・破棄と依存グラフ
        run: node scripts/sim/product-web-test.mjs
      - name: Android試験の経路判定とUSBへの誤退避の拒否
        run: |
          node scripts/device/android-dry-run-test.mjs
          node scripts/device/wifi-route-test.mjs
          node scripts/device/fault-timeline-test.mjs
          node scripts/device/rtc-fault-observer-test.mjs
          node scripts/device/wifi-host-analysis-test.mjs
          node scripts/device/wifi-trial-acks-test.mjs
          node scripts/device/wifi-comparison-plan-test.mjs
          node scripts/device/summarize-wifi-overhead-test.mjs
          node scripts/device/wifi-ack-observer-test.mjs
          node scripts/device/look-gap-analysis-test.mjs
      - name: スマホのレイアウトモデル（標準生成・検証・合成・担当表示・縦横変換・保存）
        run: node scripts/sim/phone-layout-test.mjs
      - name: 改良後UIの撮影証拠の寸法と画面網羅
        run: node scripts/sim/verify-ui-evidence.mjs
      - name: 操作定義の静的抽出
        run: node scripts/sim/profile-extract-test.mjs
      - name: カタログと操作定義の照合
        run: node scripts/sim/profile-catalog-test.mjs
      - name: 静的画面の構文
        run: node scripts/sim/check-static-pages.mjs
      - name: 画像と外部化したCSS・JSの配信
        run: node scripts/sim/static-assets-sim.mjs
      - name: 観客表示と診断画面の起動・受信境界・破棄
        id: auxiliary-pages
        env:
          RECOOPLAY_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/recooplay-smoke-diagnostics
        run: node scripts/sim/auxiliary-pages-smoke.mjs --pages overlay,diagnostics,pseudo-game
      - uses: actions/upload-artifact@v4
        if: failure() && steps.auxiliary-pages.outcome == 'failure'
        with:
          name: auxiliary-pages-diagnostics
          path: ${{ runner.temp }}/recooplay-smoke-diagnostics
      - name: 入力プローブの安全経路（--mock、OS 入力なし）
        run: node scripts/sim/input-probe-sim.mjs
      - uses: actions/cache@v4
        with:
          path: apps/desktop/target
          key: package-desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
      - name: 同じソースから配布用PCアプリをビルド
        run: cargo build --release --locked --manifest-path apps/desktop/Cargo.toml
      - name: PCアプリの起動失敗時の案内
        run: cargo test --release --locked --manifest-path apps/desktop/Cargo.toml
      - name: Windows配布zipを作成
        shell: powershell
        run: ./scripts/windows/package.ps1
      - name: 配布zipの同梱物・展開後の起動を確認（OS入力なし）
        run: node scripts/sim/package-smoke.mjs
      - name: Windowsインストーラーを作成（NSIS、zipと同じ同梱物）
        shell: powershell
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          ./scripts/windows/build-installer.ps1
      - name: インストーラーの事前チェック・サイレント導入・更新・アンインストール（取得・PC設定変更なし）
        run: node scripts/sim/installer-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ReCooplay-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-
      - run: cargo build --release --locked
        working-directory: apps/desktop
