name: 通信・補助画面・PCアプリの反復試験
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 同じコミットのWindows配布物を作成したCI run ID
        required: true
        type: string
      suite:
        description: coreは通信と補助画面、desktopは配布WebView2、allは両方
        required: true
        type: choice
        default: core
        options: [core, desktop, all]
permissions:
  contents: read
  actions: read
jobs:
  repeat:
    name: repeat (${{ matrix.suite }}, ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.suite == 'desktop' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        suite: ${{ fromJSON(inputs.suite == 'all' && '["core","desktop"]' || inputs.suite == 'desktop' && '["desktop"]' || '["core"]') }}
    env:
      RECOOPLAY_DRY_RUN: '1'
      REPEAT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 配布runのコミットと成功を確認する
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          if ($env:BUILD_RUN -notmatch '^[0-9]+$') { throw 'CI run IDには数字を指定してください' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $env:GITHUB_SHA -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/rust.yml') {
            throw '同じコミットで成功したRust CIのrunを指定してください'
          }
      - uses: actions/download-artifact@v4
        with:
          name: ReCooplay-windows-x64
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/repeat-package
      - name: 同じコミットの配布物を照合して展開する
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP repeat-package
          $zips = @(Get-ChildItem -LiteralPath $folder -Filter '*.zip' -File)
          if ($zips.Count -ne 1) { throw '配布ZIPを一意に特定できません' }
          $zip = $zips[0]
          $sidecar = (Get-Content -LiteralPath ($zip.FullName + '.sha256') -Raw).Trim() -split '\s+'
          if ($sidecar[0] -ne (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash) { throw '配布ZIPのSHA-256が一致しません' }
          $expanded = Join-Path $env:RUNNER_TEMP repeat-expanded
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expanded
          $manifests = @(Get-ChildItem -LiteralPath $expanded -Recurse -Filter package-manifest.json -File)
          if ($manifests.Count -ne 1) { throw '配布マニフェストを一意に特定できません' }
          $manifest = Get-Content -LiteralPath $manifests[0].FullName -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:GITHUB_SHA -or $manifest.dirty -ne $false) { throw '配布版と試験コードのコミットが一致しません' }
          $root = $manifests[0].DirectoryName
          Copy-Item -LiteralPath (Join-Path $root 'apps/web/dist') -Destination apps/web -Recurse
          "REPEAT_HOST=$(Join-Path $root 'recooplay-host.exe')" >> $env:GITHUB_ENV
          "REPEAT_PACKAGE=$root" >> $env:GITHUB_ENV
      - name: 各試験を5回実行する
        if: matrix.suite == 'core'
        shell: pwsh
        run: |
          # runner の値はジョブの env では使えないため、手順の中で決める
          $env:REPEAT_DIAGNOSTICS = Join-Path $env:RUNNER_TEMP 'repeat-diagnostics'
          New-Item -ItemType Directory -Path $env:REPEAT_DIAGNOSTICS -Force | Out-Null
          $failures = 0
          $first = ([int]$env:REPEAT_SHARD - 1) * 5 + 1
          for ($attempt = $first; $attempt -lt $first + 5; $attempt++) {
            $env:RECOOPLAY_SMOKE_DIAGNOSTICS = Join-Path $env:REPEAT_DIAGNOSTICS "browser-$attempt"
            $log = Join-Path $env:REPEAT_DIAGNOSTICS "protocol-$attempt.txt"
            $env:RECOOPLAY_PROTOCOL_DIAGNOSTICS = Join-Path $env:RUNNER_TEMP "protocol-sessions-$attempt"
            node scripts/sim/protocol-sim.mjs --bin $env:REPEAT_HOST *> $log
            if ($LASTEXITCODE) {
              $failures++
              Write-Host "通信試験 $attempt 回目が失敗"
              if (Test-Path -LiteralPath $env:RECOOPLAY_PROTOCOL_DIAGNOSTICS) {
                foreach ($session in Get-ChildItem -LiteralPath $env:RECOOPLAY_PROTOCOL_DIAGNOSTICS -Recurse -File -Filter 'session-*.jsonl') {
                  $name = "protocol-$attempt-$($session.Directory.Name)-$($session.Name)"
                  Copy-Item -LiteralPath $session.FullName -Destination (Join-Path $env:REPEAT_DIAGNOSTICS $name)
                }
              }
            }
            $log = Join-Path $env:REPEAT_DIAGNOSTICS "browser-$attempt.txt"
            node scripts/sim/auxiliary-pages-smoke.mjs --bin $env:REPEAT_HOST --pages overlay,diagnostics,pseudo-game *> $log
            if ($LASTEXITCODE) { $failures++; Write-Host "補助画面 $attempt 回目が失敗" }
          }
          if ($failures) { throw "失敗: $failures / 10" }
      - name: 配布PCアプリのWebView2試験を5回実行する
        if: matrix.suite == 'desktop'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'repeat-diagnostics'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $results = @()
          $first = ([int]$env:REPEAT_SHARD - 1) * 5 + 1
          for ($attempt = $first; $attempt -lt $first + 5; $attempt++) {
            $env:RECOOPLAY_SMOKE_DIAGNOSTICS = Join-Path $diagnostics "desktop-$attempt"
            $log = Join-Path $diagnostics "desktop-$attempt.txt"
            $clock = [Diagnostics.Stopwatch]::StartNew()
            node scripts/sim/desktop-webview2-smoke.mjs $env:REPEAT_PACKAGE *> $log
            $status = $LASTEXITCODE
            $clock.Stop()
            $results += [pscustomobject]@{ attempt = $attempt; exitCode = $status; durationMs = $clock.ElapsedMilliseconds }
            # 各回の結果を保存する。後続が成功しても、元の失敗を上書きしない。
            ConvertTo-Json -InputObject @($results) | Set-Content -LiteralPath (Join-Path $diagnostics 'desktop-results.json') -Encoding utf8
            Write-Host "配布WebView2 $attempt 回目: 終了コード $status ($($clock.ElapsedMilliseconds)ms)"
          }
          $failures = @($results | Where-Object { $_.exitCode -ne 0 }).Count
          if ($failures) { throw "配布WebView2の失敗: $failures / 5" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite == 'desktop' && 'repeat-desktop-diagnostics' || 'repeat-diagnostics' }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/repeat-diagnostics
