name: 遅延の計測用ビルド
# 押してから実入力までの遅延を測るための配布物を作る (手動で起動するときだけ)。
# ホストは feature latency-measure、スマホの画面は npm run build:latency でビルドする。
# 通常の配布物 (rust.yml の package) とは別の名前で保存し、リリースには使わない。
permissions:
  contents: read
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: never
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # bindgen (datachannel-sys) と OpenSSL のビルドに使う。Git 付属の Perl では OpenSSL をビルドできない
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Strawberry Perl を優先する
        timeout-minutes: 5
        shell: pwsh
        run: echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        timeout-minutes: 8
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/host-rs/target
          key: host-rs-${{ runner.os }}-${{ hashFiles('apps/host-rs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: host-rs-${{ runner.os }}-
      - name: Rustの版をそろえる（rust-toolchain.toml）
        timeout-minutes: 10
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
      - name: スマホの画面を計測用にビルドする
        timeout-minutes: 10
        working-directory: apps/web
        run: |
          npm ci
          npm run build:latency
      - name: ホストを計測用にビルドして試験する
        timeout-minutes: 30
        working-directory: apps/host-rs
        run: |
          cargo test --release --locked --features latency-measure
          cargo build --release --locked --features latency-measure
      - name: PCアプリをビルドする
        timeout-minutes: 25
        working-directory: apps/desktop
        run: cargo build --release --locked
      - name: 計測用の配布zipを作る（通常の配布物と名前を分ける）
        timeout-minutes: 5
        shell: powershell
        run: |
          ./scripts/windows/package.ps1
          Get-ChildItem dist -Filter 'ReCooplay-*-windows-x64.zip' | ForEach-Object {
            $name = $_.Name -replace '\.zip$', '-latency-measure.zip'
            Rename-Item $_.FullName $name
            $hash = (Get-FileHash (Join-Path dist $name) -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path (Join-Path dist "$name.sha256") -Value "$hash  $name" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: ReCooplay-windows-x64-latency-measure
          path: |
            dist/*-latency-measure.zip
            dist/*-latency-measure.zip.sha256
          if-no-files-found: error
